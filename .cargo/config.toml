# Cargo environment variables, common to the whole workspace.
[env]
# TypeScript types generated by ts-rs on each `cargo test`: they go into the
# web application, which imports them.
TS_RS_EXPORT_DIR = { value = "web/src/api/generated", relative = true }
# i64 and u64 become `number` on the TypeScript side: ids and counters stay
# far from 2^53.
TS_RS_LARGE_INT = "number"

# On Windows (MSVC), the C runtime is built into prisme.exe: the executable no
# longer requires VCRUNTIME140.dll, missing from some machines.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
