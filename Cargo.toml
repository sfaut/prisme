# Workspace Cargo de Prisme : un dossier par crate sous crates/
# (voir CLAUDE.md, section « Organisation du dépôt »).

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Version de Prisme, commune à tous les crates : elle suit l'étiquette Git
# de la release (v0.1.0 → 0.1.0), comme celle de web/package.json.
version = "0.1.0"
edition = "2024"
license = "MIT"
