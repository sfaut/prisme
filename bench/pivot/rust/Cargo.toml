# Benchmark of the Pivoteur's engine, Rust side (see bench/pivot/run.mjs).
# Standalone package, outside the workspace of Prisme: it only uses the
# standard library, and keeps the release profile of Prisme (Cargo's default).

[package]
name = "pivot-bench"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Empty workspace: the package does not belong to the workspace of the root.
[workspace]
