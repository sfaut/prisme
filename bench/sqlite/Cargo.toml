# Measures of the SQLite embedded in Prisme (see src/main.rs): the behaviours
# of the library that the SQLite connector relies on (attachments, read-only,
# databases in memory, interruption, transactions, paths). Workspace of its
# own, outside the one of Prisme, with the version and the features of
# rusqlite that Prisme uses (crates/server), plus "hooks", whose update hook
# is measured as a way to count the rows of a write (section 15), and that
# Prisme does not use.

[workspace]
resolver = "3"

[package]
name = "sqlite-measures"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
rusqlite = { version = "0.43.0", features = ["bundled", "hooks"] }
