# Intégration continue et livraison de Prisme.
#
# À chaque push sur master et à chaque pull request : contrôle de l'interface,
# contrôle et tests du backend (y compris les tests sur de vrais serveurs, dans
# Docker), puis compilation des exécutables Windows, Linux et macOS,
# téléchargeables dans les artefacts de l'exécution.
#
# À la publication d'une release GitHub (créée avec gh, changelog rédigé à la
# main, voir CLAUDE.md, « Publication d'une version ») : les mêmes étapes sur
# le commit de l'étiquette, puis les exécutables sont ajoutés à cette release,
# téléchargeables directement depuis la page Releases. La CI n'écrit jamais
# les notes de la release.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Une nouvelle exécution sur la même branche annule la précédente, sauf pour
# une release : elle ne doit pas s'interrompre en route.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Interface Vue : formatage, lint, types, tests, puis compilation de web/dist,
  # transmis aux compilations de l'exécutable.
  web:
    name: Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Les scripts lint et format du projet corrigent les fichiers (--fix,
      # --write) : la CI appelle les outils en mode vérification.
      - name: Formatage (Prettier)
        run: npx prettier --check --experimental-cli src/
      - name: Lint (Oxlint, ESLint)
        run: |
          npx oxlint .
          npx eslint .
      - name: Types (vue-tsc)
        run: npm run type-check
      - name: Tests (Vitest)
        run: npx vitest --run
      - name: Compilation de l'interface
        run: npm run build-only
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error

  # Backend Rust : formatage, analyse statique, tous les tests. Les runners
  # Ubuntu fournissent Docker : les tests sur MySQL / MariaDB tournent aussi.
  rust:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installe la version figée par rust-toolchain.toml.
      - run: rustup toolchain install
      # Release : les versions de Cargo.toml et de web/package.json doivent
      # être celles de l'étiquette (v0.2.0 → 0.2.0), sinon prisme --version
      # mentirait. Vérifié avant les longues compilations.
      - name: Versions conformes à l'étiquette
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="${TAG#v}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | jq --raw-output '.packages[] | select(.name == "prisme-server") | .version')
          web_version=$(jq --raw-output .version web/package.json)
          echo "Étiquette $TAG, Cargo $cargo_version, interface $web_version"
          if [ "$cargo_version" != "$expected" ] || [ "$web_version" != "$expected" ]; then
            echo "::error::Les versions doivent valoir $expected : committer la montée de version avant l'étiquette."
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Formatage (cargo fmt)
        run: cargo fmt --all --check
      - name: Analyse statique (cargo clippy)
        run: cargo clippy --all-targets -- --deny warnings
      - name: Tests (y compris ceux qui demandent Docker)
        run: cargo test -- --include-ignored
      # cargo test régénère les types TypeScript (ts-rs) : ils doivent être
      # identiques à ceux du dépôt, sinon un commit les a oubliés.
      - name: Types TypeScript générés à jour
        run: |
          if [ -n "$(git status --porcelain -- web/src/api/generated)" ]; then
            git status --short -- web/src/api/generated
            git diff -- web/src/api/generated
            echo "::error::Types ts-rs non committés : lancer cargo test et committer web/src/api/generated."
            exit 1
          fi

  # Exécutables, interface embarquée. Sous Windows, le runtime C est intégré
  # (crt-static, dans .cargo/config.toml) : pas de VCRUNTIME140.dll à installer.
  #
  # TODO: signer les exécutables Windows (SignPath Foundation) et macOS (compte
  # Apple Developer, notarisation), voir docs/QUESTIONS.md, section 3.
  build:
    name: Exécutable ${{ matrix.name }}
    needs: [web, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            binary: prisme.exe
          - name: linux-x86_64
            os: ubuntu-latest
            binary: prisme
          - name: macos-universal
            os: macos-latest
            binary: prisme
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist/
      # rust-embed tolère un web/dist absent (allow_missing) : sans ce
      # contrôle, l'exécutable serait livré sans interface.
      - name: Présence de l'interface compilée
        run: test -f web/dist/index.html
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Compilation
        if: runner.os != 'macOS'
        run: cargo build --release --bin prisme
      # macOS : un binaire universel, qui tourne sur Apple Silicon et sur Intel.
      # Les deux architectures sont compilées séparément, puis réunies par lipo
      # dans target/release, comme pour les autres plateformes.
      - name: Compilation (binaire universel Apple Silicon et Intel)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --bin prisme --target aarch64-apple-darwin
          cargo build --release --bin prisme --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/prisme \
            target/aarch64-apple-darwin/release/prisme \
            target/x86_64-apple-darwin/release/prisme
          lipo -info target/release/prisme
      - uses: actions/upload-artifact@v7
        with:
          name: prisme-${{ matrix.name }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error

  # Release publiée : les exécutables y sont ajoutés, renommés avec la
  # version et la plateforme. Les notes de la release restent intactes.
  release:
    name: Release
    if: github.event_name == 'release'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: prisme-*
          path: artifacts/
      - name: Ajout des exécutables à la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir dist
          cp artifacts/prisme-windows-x86_64/prisme.exe "dist/prisme-$TAG-windows-x86_64.exe"
          cp artifacts/prisme-linux-x86_64/prisme "dist/prisme-$TAG-linux-x86_64"
          cp artifacts/prisme-macos-universal/prisme "dist/prisme-$TAG-macos-universal"
          chmod +x dist/prisme-*
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
