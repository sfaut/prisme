# Continuous integration and delivery of Prisme.
#
# On each push to master and each pull request: checks of the interface,
# checks and tests of the backend (including the tests on real servers, in
# Docker), without building the executables, for feedback in two minutes. A
# change that only touches the documentation starts nothing.
#
# On publishing a GitHub release (created with gh, changelog written by hand,
# see CLAUDE.md, "Publishing a version"): the same checks on the tagged
# commit, then the build of the Windows, Linux and macOS executables, added
# to this release, downloadable directly from the Releases page. The CI
# never writes the release notes.
#
# Started by hand (workflow_dispatch): checks and executables, stored in the
# run's artifacts, to try a build outside a release.

name: CI

# Files without effect on the code: changing only them does not start the CI.
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**", ".claude/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".claude/**", "LICENSE"]
  release:
    types: [published]
  workflow_dispatch:

# A new run on the same branch cancels the previous one, except for a
# release: it must not stop halfway.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Vue interface: formatting, lint, types, tests, then build of web/dist,
  # passed on to the builds of the executable.
  web:
    name: Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The project's lint and format scripts fix the files (--fix, --write):
      # the CI calls the tools in check mode.
      - name: Formatting (Prettier)
        run: npx prettier --check --experimental-cli src/
      - name: Lint (Oxlint, ESLint)
        run: |
          npx oxlint .
          npx eslint .
      - name: Types (vue-tsc)
        run: npm run type-check
      - name: Tests (Vitest)
        run: npx vitest --run
      - name: Build of the interface
        run: npm run build-only
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error

  # Rust backend: formatting, static analysis, all the tests. The Ubuntu
  # runners provide Docker: the tests on MySQL / MariaDB run too.
  rust:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the version pinned by rust-toolchain.toml.
      - run: rustup toolchain install
      # Release: the versions of Cargo.toml and web/package.json must be those
      # of the tag (v0.2.0 → 0.2.0), otherwise prisme --version would lie.
      # Checked before the long builds.
      - name: Versions match the tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="${TAG#v}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | jq --raw-output '.packages[] | select(.name == "prisme-server") | .version')
          web_version=$(jq --raw-output .version web/package.json)
          echo "Tag $TAG, Cargo $cargo_version, interface $web_version"
          if [ "$cargo_version" != "$expected" ] || [ "$web_version" != "$expected" ]; then
            echo "::error::The versions must be $expected: commit the version bump before the tag."
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Formatting (cargo fmt)
        run: cargo fmt --all --check
      - name: Static analysis (cargo clippy)
        run: cargo clippy --all-targets -- --deny warnings
      - name: Tests (including those that require Docker)
        run: cargo test -- --include-ignored
      # cargo test regenerates the TypeScript types (ts-rs): they must be
      # identical to those of the repository, otherwise a commit forgot them.
      - name: Generated TypeScript types up to date
        run: |
          if [ -n "$(git status --porcelain -- web/src/api/generated)" ]; then
            git status --short -- web/src/api/generated
            git diff -- web/src/api/generated
            echo "::error::Uncommitted ts-rs types: run cargo test and commit web/src/api/generated."
            exit 1
          fi

  # Executables, interface embedded. On Windows, the C runtime is built in
  # (crt-static, in .cargo/config.toml): no VCRUNTIME140.dll to install.
  #
  # TODO: sign the Windows (SignPath Foundation) and macOS (Apple Developer
  # account, notarization) executables, see docs/QUESTIONS.md, section 3.
  build:
    name: Executable ${{ matrix.name }}
    # For a release, or on demand; never for a mere push.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [web, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            binary: prisme.exe
          - name: linux-x86_64
            os: ubuntu-latest
            binary: prisme
          - name: macos-universal
            os: macos-latest
            binary: prisme
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist/
      # rust-embed tolerates a missing web/dist (allow_missing): without this
      # check, the executable would ship without an interface.
      - name: Built interface present
        run: test -f web/dist/index.html
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --bin prisme
      # macOS: a universal binary, which runs on Apple Silicon and on Intel.
      # Both architectures are built separately, then joined by lipo in
      # target/release, as for the other platforms.
      - name: Build (universal binary for Apple Silicon and Intel)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --bin prisme --target aarch64-apple-darwin
          cargo build --release --bin prisme --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/prisme \
            target/aarch64-apple-darwin/release/prisme \
            target/x86_64-apple-darwin/release/prisme
          lipo -info target/release/prisme
      - uses: actions/upload-artifact@v7
        with:
          name: prisme-${{ matrix.name }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error

  # Published release: the executables are added to it, renamed with the
  # version and the platform. The release notes stay untouched.
  release:
    name: Release
    if: github.event_name == 'release'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: prisme-*
          path: artifacts/
      - name: Add the executables to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir dist
          cp artifacts/prisme-windows-x86_64/prisme.exe "dist/prisme-$TAG-windows-x86_64.exe"
          cp artifacts/prisme-linux-x86_64/prisme "dist/prisme-$TAG-linux-x86_64"
          cp artifacts/prisme-macos-universal/prisme "dist/prisme-$TAG-macos-universal"
          chmod +x dist/prisme-*
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
