[package]
name = "prisme-connectors"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
mysql_async = "0.37.1"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
ts-rs = "12.0.1"

[dev-dependencies]
testcontainers-modules = { version = "0.15.0", features = ["mysql", "mariadb"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }

