[package]
name = "prisme-dialects"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
prisme-splitter = { path = "../splitter" }
serde = { version = "1.0.229", features = ["derive"] }
# Pinned: `src/mysql_parser.rs` delegates the methods `MySqlDialect` overrides
# in this version. On an upgrade, compare them (see its module comment).
sqlparser = { version = "=0.63.0", features = ["visitor"] }
thiserror = "2.0.21"
yaml_serde = "0.10.7"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }

