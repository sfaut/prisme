[package]
name = "prisme-dialects"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
prisme-plan = { path = "../plan" }
prisme-splitter = { path = "../splitter" }
prisme-types = { path = "../types" }
serde = { version = "1.0.229", features = ["derive"] }
sqlparser = { version = "0.63.0", features = ["visitor"] }
thiserror = "2.0.21"
yaml_serde = "0.10.7"

[dev-dependencies]
indoc = "2.0.8"
prisme-connectors = { path = "../connectors" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
secrecy = "0.10.3"
testcontainers-modules = "0.15.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync", "time"] }

