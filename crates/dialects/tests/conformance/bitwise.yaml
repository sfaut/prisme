# Rules `bitwise.operand` and `bitwise.binary`: the operands of `|`, `&`,
# `^`, `~`, `<<` and `>>` read as unsigned integers as the input does
# (crates/probe/cases/bitwise-readings.sql, bitwise-binary.sql,
# bitwise-numbers.txt): strings, numbers from 2^63, byte strings, which MySQL
# computes byte by byte; floating point numbers, times with a fraction of a
# second and JSON values are refused. Rule `bitwise.shift`: the count of a
# shift, taken modulo 2^32 by MariaDB (bitwise-shifts.txt).
setup:
  - DROP TABLE IF EXISTS bitwise
  - >-
    CREATE TABLE bitwise (id INT NOT NULL PRIMARY KEY, s VARCHAR(40) NULL,
    b VARBINARY(8) NULL, c BINARY(2) NULL, de DECIMAL(25, 1) NULL, i BIGINT NULL,
    t BIT(8) NULL, tm TIME(1) NULL, dt DATETIME(1) NULL)
  - >-
    INSERT INTO bitwise VALUES
    (1, '3.7', X'0F', X'0F0F', 9223372036854775808.0, 5, b'110', '10:00:59.5', '1999-12-31 23:59:59.6'),
    (2, '-3.7', '12', X'3132', 18446744073709551616.0, -1, b'1', '-10:00:00.4', '2024-01-01 10:00:00.5'),
    (3, '2.5', X'', NULL, -9223372036854775809.6, 9223372036854775807, NULL, NULL, NULL),
    (4, '-2.5', '3.7', NULL, 2.5, -9223372036854775808, NULL, NULL, NULL),
    (5, '1e3', X'FF', NULL, 12.5, 0, NULL, NULL, NULL),
    (6, ' 12', '-2.5', NULL, -3.5, 12, NULL, NULL, NULL),
    (7, '12abc', NULL, NULL, 9223372036854775807.6, 4294967297, NULL, NULL, NULL),
    (8, '18446744073709551615', NULL, NULL, NULL, -4294967295, NULL, NULL, NULL),
    (9, '9223372036854775808', NULL, NULL, NULL, 63, NULL, NULL, NULL),
    (10, '18446744073709551616', NULL, NULL, NULL, NULL, NULL, NULL, NULL),
    (11, '-9223372036854775809', NULL, NULL, NULL, NULL, NULL, NULL, NULL),
    (12, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL)
cases:
  # Read alike: integers, `BIT`, dates, times without a fraction, small
  # decimals.
  - from: mysql
    sql: >-
      SELECT id, i | 1 AS a, i & 6 AS b, i ^ 3 AS c, ~i AS d, i << 2 AS e, i >> 1 AS f,
      t | 1 AS g, ~t AS h, 1 << 3.7 AS k, 1 << id AS l FROM bitwise ORDER BY id
  - from: mariadb
    sql: >-
      SELECT id, i | 1 AS a, i & 6 AS b, i ^ 3 AS c, ~i AS d, i << 2 AS e, i >> 1 AS f,
      t | 1 AS g, ~t AS h, 1 << 3.7 AS k, 1 << id AS l FROM bitwise ORDER BY id
  - from: mysql
    sql: SELECT d | 0 AS d, t | 0 AS t, ~n AS n, n ^ 1 AS m FROM sample
  - from: mariadb
    sql: SELECT d | 0 AS d, t | 0 AS t, ~n AS n, n ^ 1 AS m FROM sample
  # Counts of a shift: alike in `[-2^31, 2^32)`, a `BIGINT` bounded towards
  # MariaDB, taken modulo 2^32 towards MySQL; a string column refused.
  - from: mysql
    sql: SELECT id, 1 << i AS a, 256 >> i AS b, id << i AS c FROM bitwise ORDER BY id
  - from: mariadb
    sql: SELECT id, 1 << i AS a, 256 >> i AS b, id << i AS c FROM bitwise ORDER BY id
  - from: mysql
    sql: >-
      SELECT 1 << 4294967297 AS a, 1 << '3abc' AS b, 1 << 2.5e0 AS c, 1 << 3.5 AS d,
      1 << -1 AS e, 1 << ' 3' AS g
  - from: mariadb
    sql: >-
      SELECT 1 << 4294967297 AS a, 1 << '3abc' AS b, 1 << 2.5e0 AS c, 1 << 3.5 AS d,
      1 << -1 AS e, 1 << ' 3' AS g
  - from: mysql
    sql: SELECT id, 1 << s AS v FROM bitwise ORDER BY id
    refused: bitwise.shift
  # Strings: a literal of MySQL read by `CAST(x AS SIGNED)`; a column of
  # MySQL, read by expression, refused.
  - from: mysql
    sql: >-
      SELECT '3.7' | 0 AS a, ~'-2.5' AS b, '18446744073709551615' & 1 AS c, '1e3' ^ 0 AS e,
      ' 12' << 1 AS g, '12abc' >> 1 AS h, '9223372036854775808' | 0 AS k,
      '-9223372036854775809' | 0 AS l, '' | 0 AS m, 'a' | 'b' AS o
  - from: mysql
    sql: SELECT id, s | 0 AS v FROM bitwise ORDER BY id
    refused: bitwise.operand
  - from: mariadb
    sql: >-
      SELECT id, s | 0 AS a, ~s AS b, s << 1 AS c, s & 18446744073709551615 AS e, s ^ s AS g
      FROM bitwise ORDER BY id
  - from: mariadb
    sql: >-
      SELECT '3.7' | 0 AS a, ~'-2.5' AS b, '18446744073709551615' & 1 AS c, '1e3' ^ 0 AS e,
      ' 12' << 1 AS g, '12abc' >> 1 AS h
  # Byte strings, computed byte by byte in MySQL, read as numbers in MariaDB.
  - from: mysql
    sql: SELECT id, HEX(b | b) AS v FROM bitwise ORDER BY id
    refused: bitwise.binary
  - from: mysql
    sql: SELECT id, HEX(~c) AS v FROM bitwise ORDER BY id
    refused: bitwise.binary
  - from: mysql
    sql: SELECT id, b | 1 AS v FROM bitwise ORDER BY id
    refused: bitwise.operand
  - from: mariadb
    sql: >-
      SELECT id, b | b AS a, c | b AS e, ~b AS g, b << 1 AS h, c & 65535 AS k, b ^ 1 AS l
      FROM bitwise ORDER BY id
  # Numbers from 2^63: bounded by MySQL, taken as unsigned by MariaDB.
  - from: mysql
    sql: SELECT id, de | 0 AS a, ~de AS b, de >> 1 AS c, de & i AS e FROM bitwise ORDER BY id
  - from: mariadb
    sql: SELECT id, de | 0 AS a, ~de AS b, de >> 1 AS c, de & i AS e FROM bitwise ORDER BY id
  - from: mysql
    sql: >-
      SELECT 18446744073709551616 | 0 AS a, 9223372036854775807.6 & 1 AS b,
      ~-9223372036854775809.6 AS c
  - from: mariadb
    sql: >-
      SELECT 18446744073709551616 | 0 AS a, 9223372036854775807.6 & 1 AS b,
      ~-9223372036854775809.6 AS c
  # Floating point numbers, times with a fraction of a second, JSON values:
  # refused.
  - from: mysql
    sql: SELECT f | 0 AS v FROM sample
    refused: bitwise.operand
  - from: mariadb
    sql: SELECT ~f AS v FROM sample
    refused: bitwise.operand
  - from: mysql
    sql: SELECT id, tm | 0 AS v FROM bitwise ORDER BY id
    refused: bitwise.operand
  - from: mariadb
    sql: SELECT id, dt & 1 AS v FROM bitwise ORDER BY id
    refused: bitwise.operand
  - from: mariadb
    sql: SELECT j | 0 AS v FROM sample
    refused: bitwise.operand
