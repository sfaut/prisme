# Options of `SELECT` (crates/probe/cases/select-options.sql): those without
# effect on the rows left out towards the other dialect (`option.dialect`), and
# where the output refuses them (`option.placement`); MySQL from 8.0.18 counts
# every row of a `UNION ALL` with a `LIMIT` and without `ORDER BY` for
# `FOUND_ROWS()`, MariaDB and MySQL before up to the `LIMIT`
# (`option.found-rows`).
setup:
  - DROP TABLE IF EXISTS select_options
  - >-
    CREATE TABLE select_options (id INT NOT NULL PRIMARY KEY, a INT NOT NULL,
    b VARCHAR(10) NOT NULL)
  - >-
    INSERT INTO select_options VALUES (1, 3, 'x'), (2, 1, 'y'), (3, 2, 'x'),
    (4, 1, 'z')
cases:
  - from: mysql
    sql: >-
      SELECT SQL_CALC_FOUND_ROWS HIGH_PRIORITY SQL_BUFFER_RESULT id, a FROM
      select_options ORDER BY id LIMIT 2
  - from: mariadb
    sql: >-
      SELECT DISTINCT SQL_SMALL_RESULT STRAIGHT_JOIN o.b FROM select_options AS o
      JOIN select_options AS p ON p.a = o.a ORDER BY o.b
  - from: mysql
    sql: >-
      SELECT SQL_BIG_RESULT b, COUNT(*) AS n FROM select_options GROUP BY b ORDER
      BY b
  - from: mariadb
    sql: >-
      SELECT a FROM select_options UNION SELECT STRAIGHT_JOIN id FROM
      select_options ORDER BY a
  # The query cache of MariaDB, absent from MySQL.
  - from: mariadb
    sql: SELECT SQL_CACHE id, b FROM select_options ORDER BY id
  - from: mariadb
    sql: SELECT SQL_NO_CACHE id, b FROM select_options ORDER BY id
  # MariaDB takes `SQL_NO_CACHE` on the first `SELECT` only.
  - from: mysql
    sql: >-
      SELECT id, (SELECT SQL_NO_CACHE MAX(a) FROM select_options) AS m FROM
      select_options ORDER BY id
  - from: mysql
    sql: >-
      SELECT id FROM select_options UNION ALL SELECT SQL_NO_CACHE a FROM
      select_options ORDER BY id
  # MariaDB refuses the options of a `SELECT` between parentheses followed by
  # a `LIMIT`; MySQL before 8.0.31 reads the derived table that stands for
  # them.
  - from: mysql
    inputs: mysql >= 8.0.31
    sql: >-
      (SELECT HIGH_PRIORITY id FROM select_options ORDER BY id LIMIT 3) ORDER BY
      id DESC LIMIT 2
  - from: mysql
    inputs: mysql >= 8.0.31
    sql: >-
      (SELECT SQL_CALC_FOUND_ROWS id FROM select_options ORDER BY id LIMIT 3)
      ORDER BY id DESC LIMIT 2
    refused: option.placement
  # The count of `FOUND_ROWS()` after a `UNION ALL` with a `LIMIT`.
  - from: mysql
    inputs: mysql >= 8.0.18
    sql: >-
      SELECT SQL_CALC_FOUND_ROWS id FROM select_options UNION ALL SELECT 9 LIMIT 2
    refused: option.found-rows
  - from: mariadb
    outputs: mysql >= 8.0.18
    sql: >-
      SELECT SQL_CALC_FOUND_ROWS id FROM select_options UNION ALL SELECT 9 LIMIT 2
    refused: option.found-rows
  - from: mariadb
    sql: >-
      SELECT SQL_CALC_FOUND_ROWS id FROM select_options UNION ALL SELECT 9 ORDER
      BY id LIMIT 2
