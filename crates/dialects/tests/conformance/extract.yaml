# `EXTRACT(unit FROM x)`. Written as is when both dialects take the same
# part; a `TIME` by `HOUR`, the units of a day or of a date, and a date by
# the compound units of `DAY` written as the input reads them; refused for a
# date by the compound units of `DAY` whose day MySQL may keep or drop, a
# `TIME` by `WEEK` towards MySQL, a string or a number read otherwise and a
# value of unknown type (rule `function.extract`,
# crates/probe/cases/extract*.txt).
setup:
  - DROP TABLE IF EXISTS extract_values
  - >-
    CREATE TABLE extract_values (id INT NOT NULL PRIMARY KEY, d DATE NULL,
    dt DATETIME(6) NULL, tm TIME(2) NULL, s VARCHAR(30) NULL, i INT NULL)
  - >-
    INSERT INTO extract_values VALUES
    (1, '2024-05-06', '2024-05-06 07:08:09.123456', '100:20:30.5', '2024-05-06 07:08:09', 20240506),
    (2, '2024-12-31', '2024-12-31 23:59:59.999999', '-100:20:30.5', '10:20:30', -1),
    (3, '1000-01-01', '1000-01-01 00:00:00', '-00:20:30.25', 'x', 0),
    (4, '2024-02-29', '2024-02-29 12:00:00', '838:59:59', '2024-02-29', 2024),
    (5, NULL, NULL, NULL, NULL, NULL)
cases:
  # Parts read alike.
  - from: mysql
    sql: >-
      SELECT EXTRACT(MICROSECOND FROM tm) AS a, EXTRACT(MINUTE_SECOND FROM dt) AS b,
      EXTRACT(HOUR FROM dt) AS c, EXTRACT(HOUR_MICROSECOND FROM dt) AS e,
      EXTRACT(DAY FROM d) AS g, EXTRACT(WEEK FROM dt) AS h, EXTRACT(QUARTER FROM d) AS k,
      EXTRACT(YEAR_MONTH FROM s) AS l, EXTRACT(YEAR FROM i) AS m,
      EXTRACT(DAY_HOUR FROM '2024-05-06 07:08:09.5') AS o,
      EXTRACT(DAY_MINUTE FROM d + INTERVAL 1 HOUR) AS q,
      EXTRACT(SECOND_MICROSECOND FROM tm) AS r, EXTRACT(DAY FROM '2024-05-06') AS t
      FROM extract_values ORDER BY id
  - from: mariadb
    sql: >-
      SELECT EXTRACT(MICROSECOND FROM tm) AS a, EXTRACT(MINUTE_SECOND FROM dt) AS b,
      EXTRACT(HOUR FROM dt) AS c, EXTRACT(HOUR_MICROSECOND FROM dt) AS e,
      EXTRACT(DAY FROM d) AS g, EXTRACT(WEEK FROM dt) AS h, EXTRACT(QUARTER FROM d) AS k,
      EXTRACT(YEAR_MONTH FROM s) AS l, EXTRACT(YEAR FROM i) AS m,
      EXTRACT(DAY_HOUR FROM '2024-05-06 07:08:09.5') AS o,
      EXTRACT(DAY_MINUTE FROM d + INTERVAL 1 HOUR) AS q,
      EXTRACT(SECOND_MICROSECOND FROM tm) AS r, EXTRACT(DAY FROM '2024-05-06') AS t
      FROM extract_values ORDER BY id
  # A `TIME` by the units of an hour, of a day and of a date.
  - from: mysql
    sql: >-
      SELECT EXTRACT(HOUR FROM tm) AS a, EXTRACT(HOUR_MINUTE FROM tm) AS b,
      EXTRACT(HOUR_SECOND FROM tm) AS c, EXTRACT(HOUR_MICROSECOND FROM tm) AS e,
      EXTRACT(DAY_HOUR FROM tm) AS g, EXTRACT(DAY_MINUTE FROM tm) AS h,
      EXTRACT(DAY_SECOND FROM tm) AS k, EXTRACT(DAY_MICROSECOND FROM tm) AS l,
      EXTRACT(DAY FROM tm) AS m, EXTRACT(WEEK FROM tm) AS o, EXTRACT(MONTH FROM tm) AS q,
      EXTRACT(QUARTER FROM tm) AS r, EXTRACT(YEAR FROM tm) AS t,
      EXTRACT(YEAR_MONTH FROM tm) AS u, 2 * EXTRACT(HOUR FROM tm) AS v
      FROM extract_values ORDER BY id
  - from: mariadb
    sql: >-
      SELECT EXTRACT(HOUR FROM tm) AS a, EXTRACT(HOUR_MINUTE FROM tm) AS b,
      EXTRACT(HOUR_SECOND FROM tm) AS c, EXTRACT(HOUR_MICROSECOND FROM tm) AS e,
      EXTRACT(DAY_HOUR FROM tm) AS g, EXTRACT(DAY_MINUTE FROM tm) AS h,
      EXTRACT(DAY_SECOND FROM tm) AS k, EXTRACT(DAY_MICROSECOND FROM tm) AS l,
      EXTRACT(DAY FROM tm) AS m, EXTRACT(MONTH FROM tm) AS q,
      EXTRACT(QUARTER FROM tm) AS r, EXTRACT(YEAR FROM tm) AS t,
      EXTRACT(YEAR_MONTH FROM tm) AS u, 1 - EXTRACT(DAY FROM tm) AS v
      FROM extract_values ORDER BY id
  - from: mariadb
    sql: SELECT EXTRACT(WEEK FROM tm) FROM extract_values
    refused: function.extract
  # A date by the compound units of `DAY`: the day MySQL drops, the day
  # MariaDB keeps.
  - from: mysql
    sql: >-
      SELECT EXTRACT(DAY_HOUR FROM TIMESTAMP '2024-05-06 07:08:09') AS a,
      EXTRACT(DAY_MINUTE FROM CAST(dt AS DATETIME(6))) AS b,
      EXTRACT(DAY_MICROSECOND FROM CAST(d AS DATE)) AS c,
      EXTRACT(DAY_SECOND FROM dt + INTERVAL 1 SECOND) AS e
      FROM extract_values ORDER BY id
  - from: mysql
    compare: types
    sql: SELECT EXTRACT(DAY_HOUR FROM NOW()) AS a, EXTRACT(DAY_SECOND FROM CURDATE()) AS b
  - from: mariadb
    sql: >-
      SELECT EXTRACT(DAY_HOUR FROM dt) AS a, EXTRACT(DAY_MINUTE FROM d) AS b,
      EXTRACT(DAY_SECOND FROM TIMESTAMP '2024-05-06 07:08:09') AS c,
      EXTRACT(DAY_MICROSECOND FROM dt) AS e, EXTRACT(DAY_HOUR FROM d + INTERVAL 1 HOUR) AS g,
      EXTRACT(DAY_SECOND FROM dt) * 2 AS h
      FROM extract_values ORDER BY id
  - from: mysql
    sql: SELECT EXTRACT(DAY_HOUR FROM dt) FROM extract_values
    refused: function.extract
  # Strings, numbers and values of unknown type read otherwise.
  - from: mysql
    sql: SELECT EXTRACT(MINUTE FROM s) FROM extract_values
    refused: function.extract
  - from: mariadb
    sql: SELECT EXTRACT(DAY FROM i) FROM extract_values
    refused: function.extract
  - from: mysql
    sql: SELECT EXTRACT(YEAR FROM IFNULL(s, d)) FROM extract_values
    refused: function.extract
