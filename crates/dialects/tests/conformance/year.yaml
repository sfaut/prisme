# Rule `function.year`: `YEAR` gives the same value in both dialects, an
# `INT` in MariaDB, an unsigned `INT` in MySQL from 8.0.14 to 8.0.16 and an
# unsigned `YEAR` from 8.1.0, of the years 1 and 1000 as well
# (crates/probe/cases/year.txt).
setup:
  - DROP TABLE IF EXISTS year_values
  - CREATE TABLE year_values (id INT NOT NULL PRIMARY KEY, d DATE NULL, dt DATETIME NULL)
  - >-
    INSERT INTO year_values VALUES
    (1, '2024-05-06', '2024-05-06 07:08:09'),
    (2, '0001-01-01', '1000-01-01 00:00:00'),
    (3, '9999-12-31', NULL),
    (4, NULL, '1901-01-01 00:00:00')
cases:
  # Towards MySQL, the signed `INT` of MariaDB by `CAST`, but compared.
  - from: mariadb
    sql: >-
      SELECT id, YEAR(d) AS a, COALESCE(YEAR(dt), 1) AS b, CASE WHEN id > 1 THEN YEAR(d) ELSE 1 END AS c,
      YEAR(d) - 3000 AS e FROM year_values WHERE YEAR(dt) BETWEEN 1000 AND 2024 OR YEAR(d) = 9999
      ORDER BY YEAR(dt), id
  # Towards MariaDB, the `YEAR` of MySQL from 8.1.0 an `INT` of the same
  # value, which the report states.
  - from: mysql
    sql: >-
      SELECT id, YEAR(d) AS a, YEAR(dt) + 1 AS b, COALESCE(YEAR(d)) AS c, CASE WHEN id > 1 THEN YEAR(d) ELSE 1 END AS e
      FROM year_values WHERE YEAR(d) IN (1, 2024, 9999) ORDER BY YEAR(d)
