# Rule `function.bit-count`: `BIT_COUNT` of strings read as numbers, of
# bytes, of numbers from 2^63; a floating point number is refused.
setup:
  - DROP TABLE IF EXISTS bit_count
  - >-
    CREATE TABLE bit_count (id INT NOT NULL PRIMARY KEY, s VARCHAR(40) NULL,
    b VARBINARY(40) NULL, de DECIMAL(25, 1) NULL)
  - >-
    INSERT INTO bit_count VALUES
    (1, '3.7', X'FF0F00A5', 9223372036854775808.0),
    (2, '-3.7', X'FF0F', 9223372036854775807.6),
    (3, '3.5', X'37', -9223372036854775809.6),
    (4, '-3.5', X'', 18446744073709551616.0),
    (5, '2.5', NULL, -3.5),
    (6, '-2.5', X'FF0F00A5DEADBEEF0123456789ABCDEF00FF', 2.5),
    (7, '1e3', X'332E37', 10000000000000000000.0),
    (8, '1.5e2', X'2D31322E35', NULL),
    (9, '.5', X'3138343436373434303733373039353531363135', 0.0),
    (10, ' 7', NULL, 12.5),
    (11, '7abc', NULL, NULL),
    (12, '0x10', NULL, NULL),
    (13, '', NULL, NULL),
    (14, '-0', NULL, NULL),
    (15, 'abc', NULL, NULL),
    (16, '9223372036854775807', NULL, NULL),
    (17, '9223372036854775807.5', NULL, NULL),
    (18, '9223372036854775808', NULL, NULL),
    (19, '18446744073709551615', NULL, NULL),
    (20, '18446744073709551615.5', NULL, NULL),
    (21, '18446744073709551616', NULL, NULL),
    (22, '99999999999999999999', NULL, NULL),
    (23, '1e40', NULL, NULL),
    (24, '-9223372036854775808', NULL, NULL),
    (25, '-9223372036854775808.5', NULL, NULL),
    (26, '-9223372036854775809', NULL, NULL),
    (27, '-1e40', NULL, NULL),
    (28, NULL, NULL, NULL)
cases:
  # Read alike: integers, dates and times, decimals below 2^63, NULL.
  - from: mysql
    sql: >-
      SELECT BIT_COUNT(i) AS i, BIT_COUNT(d) AS d, BIT_COUNT(dt) AS dt, BIT_COUNT(ts) AS ts,
      BIT_COUNT(t) AS t, BIT_COUNT(n) AS n, BIT_COUNT(NULL) AS z, BIT_COUNT(-1) AS m FROM sample
  - from: mariadb
    sql: >-
      SELECT BIT_COUNT(i) AS i, BIT_COUNT(d) AS d, BIT_COUNT(dt) AS dt, BIT_COUNT(ts) AS ts,
      BIT_COUNT(t) AS t, BIT_COUNT(n) AS n, BIT_COUNT(NULL) AS z, BIT_COUNT(-1) AS m FROM sample
  # Strings: MySQL reads them by expression, the same in MariaDB.
  - from: mariadb
    sql: SELECT id, BIT_COUNT(s) AS v FROM bit_count ORDER BY id
  - from: mariadb
    sql: >-
      SELECT id, BIT_COUNT(x) AS v FROM bit_count JOIN (SELECT id AS k, s AS x FROM bit_count) AS q
      ON q.k = id ORDER BY id
  # The type of the result of a function is unknown for now.
  - from: mariadb
    sql: SELECT id, BIT_COUNT(CONCAT(s)) AS v FROM bit_count ORDER BY id
    refused: function.bit-count
  - from: mysql
    sql: >-
      SELECT BIT_COUNT('3.7') AS a, BIT_COUNT('-2.5') AS b, BIT_COUNT('18446744073709551615') AS c,
      BIT_COUNT('9223372036854775807') AS e, BIT_COUNT('9223372036854775808') AS g,
      BIT_COUNT('18446744073709551616') AS h, BIT_COUNT('-9223372036854775809') AS k,
      BIT_COUNT('  +9223372036854775808  ') AS l, BIT_COUNT('1e19') AS m, BIT_COUNT('1.5e3') AS o,
      BIT_COUNT('18446744073709551615e-400') AS p, BIT_COUNT('-1e-400') AS q, BIT_COUNT('0x10') AS r,
      BIT_COUNT('abc') AS u, BIT_COUNT('') AS w
  - from: mariadb
    sql: SELECT BIT_COUNT('3.7') AS a, BIT_COUNT('-2.5') AS b, BIT_COUNT('18446744073709551615') AS c
  - from: mysql
    sql: SELECT id, BIT_COUNT(s) AS v FROM bit_count ORDER BY id
    refused: function.bit-count
  # Bytes.
  - from: mysql
    sql: SELECT id, BIT_COUNT(b) AS v FROM bit_count ORDER BY id
  - from: mariadb
    sql: SELECT id, BIT_COUNT(b) AS v FROM bit_count ORDER BY id
  # Numbers from 2^63.
  - from: mysql
    sql: SELECT id, BIT_COUNT(de) AS v FROM bit_count ORDER BY id
  - from: mysql
    sql: >-
      SELECT id, BIT_COUNT(x) AS v FROM bit_count JOIN (SELECT id AS k, de * 1 AS x FROM bit_count) AS q
      ON q.k = id ORDER BY id
  - from: mysql
    sql: SELECT id, BIT_COUNT(COALESCE(de, de)) AS v FROM bit_count ORDER BY id
    refused: function.bit-count
  - from: mariadb
    sql: SELECT id, BIT_COUNT(de) AS v FROM bit_count ORDER BY id
  - from: mysql
    sql: >-
      SELECT BIT_COUNT(18446744073709551616) AS a, BIT_COUNT(9223372036854775807.6) AS b,
      BIT_COUNT(-9223372036854775809.6) AS c
  - from: mariadb
    sql: >-
      SELECT BIT_COUNT(18446744073709551616) AS a, BIT_COUNT(9223372036854775807.6) AS b,
      BIT_COUNT(-9223372036854775809.6) AS c
  # Floating point numbers, rounded otherwise.
  - from: mysql
    sql: SELECT BIT_COUNT(f) AS v FROM sample
    refused: function.bit-count
  - from: mariadb
    sql: SELECT BIT_COUNT(f) AS v FROM sample
    refused: function.bit-count
