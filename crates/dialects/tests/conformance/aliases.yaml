# Items of the select list read through their alias inside the expressions
# of `ORDER BY`, `GROUP BY` and `HAVING` (crates/probe/cases/alias-references.sql):
# a column of the source first, then the alias, and in `HAVING` a grouping
# column first. Towards MariaDB, an alias of an aggregate function inside an
# expression of `ORDER BY` is written as its function (rule `alias.aggregate`);
# towards MySQL 8.0.16 to 8.0.28, an alias of a window function (`alias.window`);
# a grouping column named as an alias in `HAVING` is refused towards MariaDB
# (`alias.having`).
setup:
  - DROP TABLE IF EXISTS aliases
  - CREATE TABLE aliases (id INT NOT NULL PRIMARY KEY, a INT NOT NULL, b INT NOT NULL)
  - INSERT INTO aliases VALUES (1, 3, 10), (2, 2, 30), (3, 1, 20)
cases:
  - from: mysql
    sql: SELECT id, a AS x FROM aliases ORDER BY x + 0, id
  - from: mariadb
    sql: SELECT id, a AS x FROM aliases ORDER BY -x
  # `b` names a column of the table: read before the alias inside an
  # expression, after it alone.
  - from: mysql
    sql: SELECT id, a AS b FROM aliases ORDER BY b + 0
  - from: mariadb
    sql: SELECT id, a AS b FROM aliases ORDER BY CASE WHEN b > 2 THEN 0 ELSE 1 END, b
  - from: mysql
    sql: SELECT a AS x FROM aliases GROUP BY a ORDER BY MAX(x)
  # `HAVING`: a grouping column, then an alias, then a column of the table.
  - from: mysql
    sql: SELECT a % 2 AS x, COUNT(*) AS n FROM aliases GROUP BY x HAVING x + 0 = 1
  - from: mariadb
    sql: SELECT a % 2 AS b, COUNT(*) AS n FROM aliases GROUP BY a % 2 HAVING b = 1
  - from: mysql
    sql: SELECT a % 2 AS b, COUNT(*) AS n FROM aliases GROUP BY a % 2 HAVING b + 0 = 1
  - from: mysql
    sql: SELECT COUNT(a) AS b FROM aliases GROUP BY b HAVING b = 10 ORDER BY 1
  - from: mysql
    sql: >-
      SELECT a % 2 AS b, COUNT(*) AS n FROM aliases GROUP BY a % 2, b HAVING b + 0 = 10
      ORDER BY 1, 2
    refused: alias.having
  - from: mysql
    sql: >-
      SELECT a % 2 AS b, COUNT(*) AS n FROM aliases GROUP BY a % 2, b HAVING aliases.b + 0 =
      10 ORDER BY 1, 2
    refused: alias.having
  # A key written qualified, the alias of the column itself: read as the
  # column by both.
  - from: mysql
    sql: >-
      SELECT a % 2 AS b, COUNT(*) AS n FROM aliases GROUP BY a % 2, aliases.b HAVING b + 0 =
      10 ORDER BY 1, 2
  - from: mysql
    sql: SELECT b AS B, COUNT(*) AS n FROM aliases GROUP BY b HAVING b + 0 = 10
  # An alias of an aggregate function, written as its function towards
  # MariaDB (error 1247); read as one value for all the rows by MySQL before
  # 8.0.29 (Bug #32695670): refused from these versions.
  - from: mysql
    sql: SELECT a % 2 AS x, COUNT(*) AS n FROM aliases GROUP BY x ORDER BY -n, x
    inputs: mysql >= 8.0.29
  - from: mysql
    sql: SELECT a % 2 AS x, COUNT(*) AS n FROM aliases GROUP BY x ORDER BY -n, x
    inputs: mysql < 8.0.29
    refused: alias.aggregate
  - from: mysql
    sql: >-
      SELECT a % 2 AS x, MAX(b) AS m FROM aliases GROUP BY x HAVING ABS(m) >= 20 ORDER
      BY m + 0, x
    inputs: mysql >= 8.0.29
  # An alias of a window function, written as its function towards MySQL
  # 8.0.16 to 8.0.28 (Bug #32695670).
  - from: mariadb
    sql: SELECT id, ROW_NUMBER() OVER (ORDER BY b) AS r FROM aliases ORDER BY r + 0
  - from: mariadb
    sql: SELECT id, RANK() OVER w AS r FROM aliases WINDOW w AS (ORDER BY b) ORDER BY -r
  # A name alone in a window: an alias first in MariaDB, written as its
  # expression towards MySQL (`alias.window-name`); a column of the source in
  # MySQL, written with its table towards MariaDB (`alias.window-column`).
  # Inside an expression, a column first in both.
  - from: mariadb
    sql: SELECT id, a AS x, ROW_NUMBER() OVER (ORDER BY x) AS r FROM aliases ORDER BY id
  - from: mariadb
    sql: SELECT id, ROW_NUMBER() OVER (ORDER BY x DESC) AS r, a AS x FROM aliases ORDER BY id
  - from: mariadb
    sql: SELECT id, a AS b, ROW_NUMBER() OVER (ORDER BY b) AS r FROM aliases ORDER BY id
  - from: mysql
    sql: SELECT id, a AS b, ROW_NUMBER() OVER (ORDER BY b) AS r FROM aliases ORDER BY id
    inputs: mysql >= 8.0.14
  - from: mariadb
    sql: SELECT id, a % 2 AS x, SUM(b) OVER (PARTITION BY x) AS s FROM aliases ORDER BY id
  - from: mariadb
    sql: >-
      SELECT id, a AS x, ROW_NUMBER() OVER w AS r FROM aliases WINDOW w AS (ORDER BY x)
      ORDER BY id
  - from: mysql
    sql: >-
      SELECT id, a AS b, ROW_NUMBER() OVER w AS r FROM aliases WINDOW w AS (ORDER BY b)
      ORDER BY id
    inputs: mysql >= 8.0.14
  - from: mariadb
    sql: SELECT id, a AS x FROM aliases ORDER BY ROW_NUMBER() OVER (ORDER BY x)
  - from: mysql
    sql: SELECT id, a AS b FROM aliases ORDER BY ROW_NUMBER() OVER (ORDER BY b)
    inputs: mysql >= 8.0.14
  - from: mysql
    sql: SELECT id, a AS b, ROW_NUMBER() OVER (ORDER BY -b) AS r FROM aliases ORDER BY id
  - from: mariadb
    sql: SELECT id, a AS x, ROW_NUMBER() OVER (ORDER BY -x) AS r FROM aliases ORDER BY id
  - from: mariadb
    sql: >-
      SELECT a % 2 AS x, COUNT(*) AS n, RANK() OVER (ORDER BY n DESC, x) AS r FROM aliases
      GROUP BY x ORDER BY x
  - from: mysql
    sql: >-
      SELECT a % 2 AS x, COUNT(*) AS n, RANK() OVER (ORDER BY n + 0, -x) AS r FROM aliases
      GROUP BY x ORDER BY x
    inputs: mysql >= 8.0.29
  - from: mysql
    sql: >-
      SELECT a % 2 AS x, COUNT(*) AS n, RANK() OVER (ORDER BY n + 0, -x) AS r FROM aliases
      GROUP BY x ORDER BY x
    inputs: mysql < 8.0.29
    refused: alias.aggregate
  # An `ORDER BY` after a `SELECT` between parentheses without `ORDER BY` or
  # `LIMIT` of its own: the names of the `SELECT` in MariaDB and MySQL, a
  # column of the table first inside an expression; the columns of the result
  # in MySQL 8.0.31 to 8.0.41, 8.1.0 to 8.4.4 and 9.0.0 to 9.2.0, emulated by a
  # derived table towards the others (rule `order.parenthesized`).
  - from: mysql
    sql: (SELECT id, a AS b FROM aliases) ORDER BY b + 0
  - from: mysql
    sql: ((SELECT id, a AS b FROM aliases WHERE id > 0)) ORDER BY CONCAT(b), id
  - from: mysql
    sql: (SELECT id, a AS x FROM aliases) ORDER BY -x
  - from: mysql
    sql: (SELECT id, a AS b FROM aliases) ORDER BY (SELECT -b)
    inputs: mysql < 8.0.42 or mysql >= 8.1.0 and mysql < 8.4.5 or mysql >= 9.0.0 and mysql < 9.3.0
  - from: mysql
    sql: (SELECT id FROM aliases) ORDER BY a + 0
    inputs: mysql < 8.0.31 or mysql >= 8.0.42 and mysql < 8.1.0 or mysql >= 8.4.5 and mysql < 9.0.0 or mysql >= 9.3.0
  - from: mariadb
    sql: (SELECT id, a AS b FROM aliases) ORDER BY -b
  - from: mariadb
    sql: (SELECT id FROM aliases) ORDER BY a + 0
  # An expression of the alias of a grouping key that is an expression, with
  # aggregate functions: sorted otherwise by the versions that read the
  # columns of the result, refused from them.
  - from: mysql
    sql: (SELECT a % 2 AS x, COUNT(*) AS n FROM aliases GROUP BY x) ORDER BY -x
    inputs: mysql < 8.0.31 or mysql >= 8.0.42 and mysql < 8.1.0 or mysql >= 8.4.5 and mysql < 9.0.0 or mysql >= 9.3.0
  - from: mysql
    sql: (SELECT a % 2 AS x, COUNT(*) AS n FROM aliases GROUP BY x) ORDER BY -x
    inputs: mysql >= 8.0.31 and mysql < 8.0.42 or mysql >= 8.1.0 and mysql < 8.4.5 or mysql >= 9.0.0 and mysql < 9.3.0
    refused: order.parenthesized
  - from: mariadb
    sql: (SELECT a % 2 AS x, COUNT(*) AS n FROM aliases GROUP BY x) ORDER BY -x
  # An `ORDER BY` after a query between parentheses with its own `ORDER BY`
  # or `LIMIT`: the columns of the result. MariaDB before the fix of
  # MDEV-29681 reads a key other than a name alone or a position otherwise,
  # every MariaDB sorts by a subquery there in no defined order: a derived
  # table towards them, refused from them (rule `order.parenthesized`).
  - from: mysql
    sql: (SELECT id, a AS b FROM aliases ORDER BY id LIMIT 3) ORDER BY b + 0
  - from: mysql
    sql: (SELECT id, a AS b FROM aliases UNION ALL SELECT 4, 0 ORDER BY id) ORDER BY -b
    inputs: mysql < 8.0.19 or mysql >= 8.0.31
  - from: mysql
    sql: (SELECT id, a AS b FROM aliases LIMIT 3) ORDER BY (SELECT -b)
    inputs: mysql < 8.0.14 or mysql >= 8.0.18
  - from: mariadb
    sql: (SELECT id, a AS b FROM aliases ORDER BY id LIMIT 3) ORDER BY b DESC, 1
  - from: mariadb
    sql: (SELECT id, a AS b FROM aliases LIMIT 3) ORDER BY b + 0
    inputs: >-
      mariadb < 10.6.0 or mariadb >= 10.6.17 and mariadb < 10.7.0 or mariadb >= 10.11.7 and
      mariadb < 11.0.0 or mariadb >= 11.0.5 and mariadb < 11.1.0 or mariadb >= 11.1.4 and
      mariadb < 11.2.0 or mariadb >= 11.2.3 and mariadb < 11.3.0 or mariadb >= 11.3.2
  - from: mariadb
    sql: (SELECT id, a AS b FROM aliases LIMIT 3) ORDER BY b + 0
    inputs: >-
      mariadb >= 10.6.0 and mariadb < 10.6.17 or mariadb >= 10.7.0 and mariadb < 10.11.7 or
      mariadb >= 11.0.0 and mariadb < 11.0.5 or mariadb >= 11.1.0 and mariadb < 11.1.4 or
      mariadb >= 11.2.0 and mariadb < 11.2.3 or mariadb >= 11.3.0 and mariadb < 11.3.2
    refused: order.parenthesized
  - from: mariadb
    sql: (SELECT id, a AS b FROM aliases LIMIT 3) ORDER BY (SELECT -b)
    refused: order.parenthesized
