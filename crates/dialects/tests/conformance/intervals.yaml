# Date and time arithmetic: `x + INTERVAL n unit`, `INTERVAL n unit + x`,
# `DATE_ADD`, `DATE_SUB`, `ADDDATE`, `SUBDATE`, `TIMESTAMPADD` and
# `TIMESTAMPDIFF`. Written in
# its form when both dialects give the same value; a `TIME` moved by days
# written on the current date towards a dialect that reads it otherwise, an
# error where the readings differ otherwise (rule `interval.time`); refused
# for another value read as a date and time (`interval.string`), years that
# may reach 2^31 (`interval.year`), microseconds of more than 6 digits
# (`interval.microseconds`) and an operand of unknown type
# (`interval.unknown`); `TIMESTAMPDIFF` refused for another value than a date,
# a time, a number of 6 fractional digits at most or a plain string literal
# (`timestampdiff.operand`), and for an operand of unknown type
# (`timestampdiff.unknown`) (crates/probe/cases/interval*.txt and
# timestampdiff*.txt).
setup:
  - DROP TABLE IF EXISTS interval_values
  - >-
    CREATE TABLE interval_values (id INT NOT NULL PRIMARY KEY, d DATE NULL,
    dt DATETIME(3) NULL, tm TIME NULL, i INT NULL, p DECIMAL(10, 2) NULL,
    n BIGINT NULL, s VARCHAR(30) NULL)
  - >-
    INSERT INTO interval_values VALUES
    (1, '2024-05-06', '2024-05-06 07:08:09.123', '10:20:30', 3, 1.50, 2, '2024-05-06'),
    (2, '2024-01-31', '2024-02-29 23:59:59.999', '-10:20:30', -40, -0.25, -1, 'x'),
    (3, NULL, NULL, NULL, NULL, NULL, NULL, NULL)
cases:
  # Forms read alike.
  - from: mysql
    sql: >-
      SELECT d + INTERVAL 1 DAY AS a, dt - INTERVAL '1:30' HOUR_MINUTE AS b,
      INTERVAL i MONTH + d AS c, DATE_ADD(d, INTERVAL '1 2:3:4.5' DAY_MICROSECOND) AS e,
      DATE_SUB(dt, INTERVAL 2 WEEK) AS g, ADDDATE(d, INTERVAL i YEAR) AS h, ADDDATE(d, i) AS k,
      SUBDATE(dt, 3) AS l, SUBDATE(d, INTERVAL 1 QUARTER) AS m, TIMESTAMPADD(MINUTE, i, dt) AS o,
      TIMESTAMPADD(SQL_TSI_MONTH, 1, d) AS q, d + INTERVAL p SECOND AS r,
      dt + INTERVAL p SECOND_MICROSECOND AS t, d + INTERVAL 1 SQL_TSI_HOUR AS u,
      INTERVAL(i, 1, 10) AS v FROM interval_values ORDER BY id
  - from: mariadb
    sql: >-
      SELECT d + INTERVAL 1 DAY AS a, dt - INTERVAL '1:30' HOUR_MINUTE AS b,
      INTERVAL i MONTH + d AS c, DATE_ADD(d, INTERVAL '1 2:3:4.5' DAY_MICROSECOND) AS e,
      DATE_SUB(dt, INTERVAL 2 WEEK) AS g, ADDDATE(d, INTERVAL i YEAR) AS h, ADDDATE(d, i) AS k,
      SUBDATE(dt, 3) AS l, SUBDATE(d, INTERVAL 1 QUARTER) AS m, TIMESTAMPADD(MINUTE, i, dt) AS o,
      TIMESTAMPADD(SQL_TSI_MONTH, 1, d) AS q, d + INTERVAL p SECOND AS r,
      dt + INTERVAL p SECOND_MICROSECOND AS t, d + INTERVAL 1 SQL_TSI_HOUR AS u,
      INTERVAL(i, 1, 10) AS v FROM interval_values ORDER BY id
  # The precedence: the sum closes at its unit, the interval first takes its
  # operand to the next `AND`.
  - from: mysql
    sql: >-
      SELECT d + INTERVAL 1 DAY * 2 AS a, d - INTERVAL 1 DAY - INTERVAL 1 HOUR AS b,
      INTERVAL 1 DAY + d AND 1 AS c, d + INTERVAL 1 + 1 DAY AS e, d + INTERVAL (i) DAY AS g
      FROM interval_values ORDER BY id
  - from: mariadb
    sql: >-
      SELECT d + INTERVAL 1 DAY * 2 AS a, d - INTERVAL 1 DAY - INTERVAL 1 HOUR AS b,
      INTERVAL 1 DAY + d AND 1 AS c, d + INTERVAL 1 + 1 DAY AS e, d + INTERVAL (i) DAY AS g
      FROM interval_values ORDER BY id
  # Bounds and ends of months, read alike.
  - from: mysql
    sql: >-
      SELECT DATE '9999-12-31' + INTERVAL 1 DAY AS a,
      TIMESTAMP '1000-01-01 00:00:00' - INTERVAL 1 SECOND AS b,
      DATE '2024-01-31' + INTERVAL 1 MONTH AS c, DATE '2024-02-29' + INTERVAL 1 YEAR AS e,
      DATE '2024-05-06' + INTERVAL -2147483647 YEAR AS g
  - from: mysql
    session: ["SET sql_mode = ''"]
    sql: SELECT DATE '0000-00-00' + INTERVAL 1 DAY AS a, DATE '2024-05-00' + INTERVAL 1 DAY AS b
  # A `TIME` moved by days: the hours added by `DAY` before MySQL 8.0.28 and
  # in MariaDB; a `DATETIME`, the time read on the current date, from MySQL
  # 8.0.28.
  - from: mysql
    inputs: mysql < 8.0.28
    sql: >-
      SELECT tm + INTERVAL 1 DAY AS a, tm - INTERVAL '1 2' DAY_HOUR AS b, tm + INTERVAL 1 HOUR AS c
      FROM interval_values ORDER BY id
  - from: mysql
    inputs: mysql >= 8.0.28
    sql: >-
      SELECT tm + INTERVAL 1 DAY AS a, TIMESTAMPADD(WEEK, 1, tm) AS b,
      DATE_SUB(tm, INTERVAL 1 MONTH) AS c FROM interval_values ORDER BY id
  - from: mysql
    inputs: mysql < 8.0.28
    sql: SELECT tm + INTERVAL 1 WEEK FROM interval_values
    refused: interval.time
  - from: mariadb
    outputs: mysql < 8.0.28
    sql: >-
      SELECT tm + INTERVAL 1 DAY AS a, tm - INTERVAL '1 2' DAY_HOUR AS b
      FROM interval_values ORDER BY id
  - from: mariadb
    outputs: mysql >= 8.0.28
    sql: SELECT tm + INTERVAL 1 DAY FROM interval_values
    refused: interval.time
  # Strings read as a date and time: alike without fraction.
  - from: mysql
    sql: >-
      SELECT '2024-05-06' + INTERVAL 1 DAY AS a, '2024-05-06 07:08:09' + INTERVAL 2 SECOND AS b,
      NULL + INTERVAL 1 DAY AS c, '2024-05-06' - INTERVAL 1 HOUR AS e
  - from: mariadb
    sql: >-
      SELECT '2024-05-06' + INTERVAL 1 DAY AS a, '2024-05-06 07:08:09' + INTERVAL 2 SECOND AS b,
      NULL + INTERVAL 1 DAY AS c, '2024-05-06' - INTERVAL 1 HOUR AS e
  - from: mysql
    sql: SELECT s + INTERVAL 1 DAY FROM interval_values
    refused: interval.string
  - from: mariadb
    sql: SELECT '2024-05-06 07:08:09.5' + INTERVAL 1 SECOND
    refused: interval.string
  # Years that may reach 2^31, reduced to 32 bits by MariaDB.
  - from: mysql
    sql: SELECT d + INTERVAL '-3' YEAR AS a, d + INTERVAL p YEAR AS b FROM interval_values ORDER BY id
  - from: mysql
    sql: SELECT DATE '2024-05-06' + INTERVAL 4294967297 YEAR
    refused: interval.year
  - from: mariadb
    sql: SELECT TIMESTAMPADD(YEAR, n, d) FROM interval_values
    refused: interval.year
  # Microseconds of more than 6 digits in a compound unit.
  - from: mysql
    sql: SELECT TIMESTAMP '2024-05-06 07:08:09' + INTERVAL '1.1234567' SECOND_MICROSECOND
    refused: interval.microseconds
  # An operand of unknown type.
  - from: mariadb
    sql: SELECT NOW() + INTERVAL 1 DAY
    refused: interval.unknown
  # TIMESTAMPDIFF: dates, times on the current date, numbers and plain strings
  # read alike.
  - from: mysql
    sql: >-
      SELECT TIMESTAMPDIFF(DAY, d, dt) AS a,
      TIMESTAMPDIFF(MICROSECOND, dt, TIMESTAMP '2024-05-07 07:08:09.122') AS b,
      TIMESTAMPDIFF(MONTH, DATE '2024-01-31', d) AS c,
      TIMESTAMPDIFF(SQL_TSI_HOUR, tm, TIME '50:00:00') AS e, TIMESTAMPDIFF(DAY, '2024-05-06', d) AS g,
      TIMESTAMPDIFF(SECOND, 20240506070809, dt) AS h, TIMESTAMPDIFF(MICROSECOND, p, dt) AS k,
      TIMESTAMPDIFF(QUARTER, NULL, d) AS l, TIMESTAMPDIFF(WEEK, d, tm) AS m
      FROM interval_values ORDER BY id
  - from: mariadb
    sql: >-
      SELECT TIMESTAMPDIFF(DAY, d, dt) AS a,
      TIMESTAMPDIFF(MICROSECOND, dt, TIMESTAMP '2024-05-07 07:08:09.122') AS b,
      TIMESTAMPDIFF(MONTH, DATE '2024-01-31', d) AS c,
      TIMESTAMPDIFF(SQL_TSI_HOUR, tm, TIME '50:00:00') AS e, TIMESTAMPDIFF(DAY, '2024-05-06', d) AS g,
      TIMESTAMPDIFF(SECOND, 20240506070809, dt) AS h, TIMESTAMPDIFF(MICROSECOND, p, dt) AS k,
      TIMESTAMPDIFF(QUARTER, NULL, d) AS l, TIMESTAMPDIFF(WEEK, d, tm) AS m
      FROM interval_values ORDER BY id
  - from: mysql
    sql: >-
      SELECT TIMESTAMPDIFF(MICROSECOND, '2024-05-06 00:00:00.1234567', DATE '2024-05-06')
    refused: timestampdiff.operand
  - from: mariadb
    sql: SELECT TIMESTAMPDIFF(DAY, s, d) FROM interval_values
    refused: timestampdiff.operand
  - from: mysql
    sql: SELECT TIMESTAMPDIFF(DAY, NOW(), d) FROM interval_values
    refused: timestampdiff.unknown
