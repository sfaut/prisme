# Rule `function.rounding`: `ABS`, `CEIL`, `CEILING`, `FLOOR`, `ROUND` and
# `TRUNCATE` of a date or a time, read as a `DOUBLE` by MySQL, as a temporal
# value by MariaDB. Towards MariaDB, `x + 0e0`; towards MySQL, `x + 0` for a
# date, a `DECIMAL` of its digits in `ABS`, an error otherwise
# (crates/probe/cases/rounding.txt, rounding-writes.txt).
setup:
  - DROP TABLE IF EXISTS rounding_values
  - >-
    CREATE TABLE rounding_values (id INT NOT NULL PRIMARY KEY, d DATE NULL, dt DATETIME(3) NULL,
    t TIME(1) NULL)
  - >-
    INSERT INTO rounding_values VALUES
    (1, '2024-05-06', '2024-05-06 07:08:09.123', '10:20:30.5'),
    (2, '9999-12-31', '9999-12-31 23:59:59.999', '-838:59:59.0'),
    (3, '1000-01-01', '1000-01-01 00:00:00.500', '-10:20:30.5'),
    (4, NULL, NULL, NULL)
cases:
  # A date or a time read as a `DOUBLE`.
  - from: mysql
    sql: >-
      SELECT id, ABS(d) AS a, CEIL(dt) AS b, CEILING(t) AS c, FLOOR(dt) AS e, ROUND(t) AS g,
      ROUND(dt, 1) AS h, ROUND(d, -2) AS k, TRUNCATE(t, -1) AS l, TRUNCATE(dt, 2) AS m,
      FLOOR(d) AS o FROM rounding_values ORDER BY id
  - from: mysql
    sql: >-
      SELECT ABS(ts) AS a, CEIL(ts) AS b, ROUND(TIME '10:20:30.5') AS c, ABS(DATE '2024-05-06') AS e
      FROM sample
  # A date read as an integer, the digits of a date or a time in `ABS`.
  - from: mariadb
    sql: >-
      SELECT id, CEIL(d) AS a, FLOOR(d) AS b, ROUND(d) AS c, ROUND(d, -2) AS e, TRUNCATE(d, -1) AS g,
      ABS(d) AS h, ABS(dt) AS k, ABS(t) AS l FROM rounding_values ORDER BY id
  - from: mariadb
    sql: SELECT ABS(ts) AS a, ABS(TIME '-10:20:30.5') AS b, CEILING(DATE '2024-05-06') AS c FROM sample
  # A date and time or a time rounded as a value of its type.
  - from: mariadb
    sql: SELECT id, CEIL(dt) AS a FROM rounding_values ORDER BY id
    refused: function.rounding
  - from: mariadb
    sql: SELECT id, ROUND(t, 1) AS a FROM rounding_values ORDER BY id
    refused: function.rounding
  # Other arguments, written as is.
  - from: mysql
    sql: SELECT ROUND(i) AS a, ABS(n) AS b, FLOOR(f) AS c, TRUNCATE(n, 1) AS e, CEIL(s) AS g FROM sample
  - from: mariadb
    sql: SELECT ROUND(i) AS a, ABS(n) AS b, FLOOR(f) AS c, TRUNCATE(n, 1) AS e, CEIL(s) AS g FROM sample
