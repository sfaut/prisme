# Constructs of the grammar, and behaviours of built-in functions, whose
# availability depends on the version (docs/DEV-DIALECTS.md, step 2). Each
# construct:
#   - id: values_row          # identifier, the `Construct` enum of versions.rs
#     since: "8.0.19"         # first version that has it (included)
#     until: "9.0.0"          # first version that no longer has it (optional)
#     source: https://...     # reference manual or release notes
#     comment: >-             # context: what the construct does, how it was
#       ...                   # established (optional)
constructs:
  - id: with
    since: "10.2.1"
    source: https://mariadb.com/kb/en/with/
  - id: with_recursive
    since: "10.2.2"
    source: https://mariadb.com/kb/en/recursive-common-table-expressions-overview/
    comment: >-
      Anchors and recursive parts in any order, but of two anchors in a row
      after a recursive part, only the last is kept; a recursive part reads the
      expression once, outside a subquery and the inner side of an outer join,
      without aggregate or window (error 4008), a derived table and `GROUP BY`
      allowed; no `ORDER BY` nor `LIMIT` over the parts (1235). The columns
      take the type of the anchors, an `INT` for an integer literal of at most
      9 digits. Measured on each local image, 10.6.28 to 11.8.9
      (crates/probe/cases/with-recursive.sql).
  - id: window_functions
    since: "10.2.0"
    source: https://mariadb.com/kb/en/window-functions-overview/
  - id: values_bare
    since: "10.3.3"
    source: https://mariadb.com/kb/en/table-value-constructors/
  - id: system_versioning
    since: "10.3.4"
    source: https://mariadb.com/kb/en/system-versioned-tables/
  - id: nested_set_operation
    since: "10.4.0"
    source: https://jira.mariadb.org/browse/MDEV-11953
  # Query between parentheses with its own `ORDER BY` or `LIMIT`, followed by
  # an outer one, read by the standard: measured on each local image, 10.5.29
  # to 11.8.9 (crates/probe/cases/parenthesized-limits.sql).
  - id: parenthesized_order_kept
    since: "10.4.0"
    source: https://jira.mariadb.org/browse/MDEV-11953
    comment: >-
      `(SELECT a FROM t ORDER BY a DESC LIMIT 2) LIMIT 5` keeps the order of
      the query between parentheses.
  - id: parenthesized_limit_kept
    since: "10.4.0"
    source: https://jira.mariadb.org/browse/MDEV-11953
    comment: >-
      `(SELECT a FROM t LIMIT 2) LIMIT 5` gives 2 rows at most.
  - id: parenthesized_offset_kept
    since: "10.4.0"
    source: https://jira.mariadb.org/browse/MDEV-11953
    comment: >-
      `(SELECT a FROM t ORDER BY a LIMIT 3) LIMIT 5 OFFSET 1` gives the
      second and third rows, from the 3 rows between parentheses.
  - id: parenthesized_set_limit
    since: "10.4.0"
    source: https://jira.mariadb.org/browse/MDEV-11953
    comment: >-
      `(SELECT a FROM t UNION SELECT 6 ORDER BY 1 LIMIT 2) LIMIT 5` gives 2
      rows.
  - id: parenthesized_set_order
    since: "10.4.0"
    source: https://jira.mariadb.org/browse/MDEV-11953
    comment: >-
      `(SELECT a FROM t UNION SELECT 6 ORDER BY 1 LIMIT 2) ORDER BY 1 DESC`
      gives 2, 1.
  # MDEV-29681: the parser wraps a query between parentheses with its own
  # `ORDER BY` or `LIMIT`, followed by an `ORDER BY`, into a derived table,
  # and the names of the outer `ORDER BY` kept the context of the query
  # between parentheses (docs/sources/mariadb/MDEV-29681.md). Measured on
  # each local image, 10.5.29 to 11.8.9 (crates/probe/cases/parenthesized-
  # order.sql): the defect from 10.6.16, 10.7.8 to 10.11.6, 11.0.2 to
  # 11.0.4, 11.1.2 to 11.1.3 and 11.2.2, fixed on 10.5.29, 10.6.17, 10.11.7,
  # 11.0.5, 11.1.4 and 11.2.3; the ends of the periods are the fix versions
  # of the ticket.
  - id: parenthesized_order_inner
    since: "10.4.0"
    until: "10.4.33"
    source: https://jira.mariadb.org/browse/MDEV-29681
    comment: >-
      After `(SELECT id, a AS b FROM t ORDER BY id LIMIT 3)`, an `ORDER BY`
      written as a name alone or a position reads the column of the result
      (`ORDER BY b`, `ORDER BY 2`), and any other key does not: `ORDER BY
      -b` sorts the rows in no defined order (the order of the derived
      table, or another), `-b` read as the column `b` of the table without
      `LIMIT`, error 1054 or 1052 over a set operation or a join; with a
      `GROUP BY` or a `DISTINCT` too. An expression of the alias of a window
      function (`ORDER BY -r`) stops the server. A derived table written as
      such reads the columns of the result. By the ticket in this branch,
      not measured.
  - id: parenthesized_order_inner
    since: "10.5.0"
    until: "10.5.24"
    source: https://jira.mariadb.org/browse/MDEV-29681
    comment: >-
      The same defect in the branch 10.5, fixed in 10.5.24 by the ticket;
      measured fixed on 10.5.29.
  - id: parenthesized_order_inner
    since: "10.6.0"
    until: "10.6.17"
    source: https://jira.mariadb.org/browse/MDEV-29681
    comment: >-
      The same defect in the branch 10.6, measured on 10.6.16, fixed on
      10.6.17 and 10.6.28.
  - id: parenthesized_order_inner
    since: "10.7.0"
    until: "10.11.7"
    source: https://jira.mariadb.org/browse/MDEV-29681
    comment: >-
      The same defect in the branches 10.7 to 10.10, never fixed, and 10.11:
      measured on 10.7.8, 10.8.8, 10.9.8, 10.10.7, 10.11.2 and 10.11.6,
      fixed on 10.11.7 to 10.11.19.
  - id: parenthesized_order_inner
    since: "11.0.0"
    until: "11.0.5"
    source: https://jira.mariadb.org/browse/MDEV-29681
    comment: >-
      The same defect in the branch 11.0, measured on 11.0.2 and 11.0.4,
      fixed on 11.0.5.
  - id: parenthesized_order_inner
    since: "11.1.0"
    until: "11.1.4"
    source: https://jira.mariadb.org/browse/MDEV-29681
    comment: >-
      The same defect in the branch 11.1, measured on 11.1.2 and 11.1.3,
      fixed on 11.1.4 and 11.1.6.
  - id: parenthesized_order_inner
    since: "11.2.0"
    until: "11.2.3"
    source: https://jira.mariadb.org/browse/MDEV-29681
    comment: >-
      The same defect in the branch 11.2, measured on 11.2.2, fixed on
      11.2.3 and 11.2.6.
  - id: parenthesized_order_inner
    since: "11.3.0"
    until: "11.3.2"
    source: https://jira.mariadb.org/browse/MDEV-29681
    comment: >-
      The same defect in the branch 11.3, fixed in 11.3.2 by the ticket;
      measured fixed on 11.3.2.
  - id: window_alias_once
    since: "10.2.0"
    source: https://mariadb.com/kb/en/window-functions-overview/
    comment: >-
      `SELECT id, ROW_NUMBER() OVER (ORDER BY b) AS r FROM t ORDER BY r + 0`
      computes the window function once, measured on each local image,
      10.5.29 to 11.8.9 (crates/probe/cases/alias-references.sql); from the
      window functions, in 10.2.0.
  - id: derived_column_list
    since: "11.7.1"
    source: https://jira.mariadb.org/browse/MDEV-31466
  - id: intersect_except
    since: "10.3.0"
    source: https://mariadb.com/kb/en/intersect/
  - id: intersect_except_all
    since: "10.5.0"
    source: https://mariadb.com/kb/en/intersect/
  - id: delete_returning
    since: "10.0.5"
    source: https://mariadb.com/kb/en/delete/
  - id: insert_returning
    since: "10.5.0"
    source: https://mariadb.com/kb/en/insertreturning/
  - id: json_table
    since: "10.6.0"
    source: https://mariadb.com/kb/en/json_table/
  - id: offset_fetch
    since: "10.6.0"
    source: https://mariadb.com/kb/en/select-offset-fetch/
  # Locking clauses (crates/probe/cases/locking.sql, measured on each local
  # image, 10.5.29 to 11.8.9; docs/sources/mariadb/locking-reads.md): `FOR
  # UPDATE` and `LOCK IN SHARE MODE` after the `LIMIT`, one clause, without
  # `FOR SHARE` nor `OF` (error 1064), each one followed by `WAIT n`,
  # `NOWAIT` or `SKIP LOCKED`.
  - id: lock_nowait
    since: "10.3.0"
    source: https://jira.mariadb.org/browse/MDEV-11379
    comment: >-
      `FOR UPDATE NOWAIT`, `LOCK IN SHARE MODE NOWAIT`, the same as `WAIT 0`
      by the documentation.
  - id: lock_wait_seconds
    since: "10.3.0"
    source: https://jira.mariadb.org/browse/MDEV-11379
    comment: >-
      `FOR UPDATE WAIT 2`: the timeout of the locks of the statement, in
      seconds; the number an integer, a decimal, an approximate or a
      hexadecimal number (`WAIT 0.5`, `WAIT 1e1`, `WAIT 0x2`), a string
      refused, as is `WAIT` alone (error 1064); beyond 2^32 - 1, two
      warnings.
  - id: share_mode_options
    since: "10.3.0"
    source: https://jira.mariadb.org/browse/MDEV-11379
    comment: >-
      `LOCK IN SHARE MODE WAIT 1`, `LOCK IN SHARE MODE NOWAIT`, `LOCK IN
      SHARE MODE SKIP LOCKED` from 10.6.0 (`lock_skip_locked`).
  - id: lock_skip_locked
    since: "10.6.0"
    source: https://jira.mariadb.org/browse/MDEV-13115
    comment: >-
      `FOR UPDATE SKIP LOCKED`, `LOCK IN SHARE MODE SKIP LOCKED`: refused
      on 10.5.29 (error 1064), accepted from 10.6.16; never with `WAIT` or
      `NOWAIT`, which it implies (MDEV-25433).
  - id: parenthesized_lock
    since: "10.4.0"
    source: https://jira.mariadb.org/browse/MDEV-11953
    comment: >-
      `(SELECT a FROM t) FOR UPDATE`, `(SELECT a FROM t UNION SELECT b FROM
      u) FOR UPDATE`, in a subquery and a derived table too: accepted on
      each local image, 10.5.29 to 11.8.9, dated by the grammar of the
      parentheses.
  # Rows locked by a locking clause next to a query between parentheses
  # (crates/probe/cases/locking-scope.sql, trx_rows_locked measured on each
  # local image, 10.5.29 to 11.8.9; `locking` module): a clause after the
  # outer `ORDER BY` or `LIMIT` locks no row when the query between
  # parentheses has its own `LIMIT` (`(SELECT a FROM t LIMIT 2) FOR UPDATE`
  # included), or an `ORDER BY` as the outer query; those of that query
  # otherwise.
  - id: parenthesized_set_order_lock
    since: "10.4.0"
    source: https://jira.mariadb.org/browse/MDEV-11953
    comment: >-
      `(SELECT a FROM t UNION SELECT b FROM u) ORDER BY a FOR UPDATE` locks
      the rows of `u`, as with an outer `LIMIT`; measured on each local
      image, 10.5.29 to 11.8.9, dated by the grammar of the parentheses.
  - id: parenthesized_inner_lock
    since: "10.4.0"
    source: https://jira.mariadb.org/browse/MDEV-11953
    comment: >-
      `(SELECT a FROM t FOR UPDATE) LIMIT 1` locks the rows of `t` read, a
      clause at the end of any query between parentheses too, whatever
      follows; measured on each local image, 10.5.29 to 11.8.9.
  - id: parenthesized_locked_limit
    since: "10.4.0"
    source: https://jira.mariadb.org/browse/MDEV-11953
    comment: >-
      `(SELECT a FROM t ORDER BY a FOR UPDATE) LIMIT 1` gives one row, as
      `(SELECT a FROM t ORDER BY a) LIMIT 1 FOR UPDATE`; measured on each
      local image, 10.5.29 to 11.8.9.
  # Targets of `CAST` and `CONVERT` (crates/probe/cases/cast-forms.txt, measured on
  # 10.6.28 and 11.8.9, and cast-bounds.txt, on 10.6.28, 10.10.7, 10.11.19 and
  # 11.8.9). Available at the floor, checked on 10.6.28, but the types `INET4`
  # and `UUID`.
  - id: cast_double
    since: "10.6.3"
    source: https://mariadb.com/kb/en/cast/
    comment: >-
      `CAST(x AS DOUBLE)` and `CAST(x AS FLOAT)`, nullable.
  - id: cast_double_digits
    since: "10.6.3"
    source: https://mariadb.com/kb/en/cast/
    comment: >-
      `CAST(x AS DOUBLE(m, d))`, rounded to `d` decimals; MySQL refuses it.
  - id: cast_integer
    since: "10.6.3"
    source: https://mariadb.com/kb/en/cast/
    comment: >-
      `CAST(x AS INTEGER)` and `CAST(x AS INT)`, without `SIGNED`: a `BIGINT`,
      as `SIGNED`; MySQL refuses them.
  - id: cast_varchar
    since: "10.6.3"
    source: https://mariadb.com/kb/en/cast/
    comment: >-
      `CAST(x AS VARCHAR(n))`, its length required, as `CHAR(n)`; MySQL
      refuses it.
  - id: cast_collate
    since: "10.6.3"
    source: https://mariadb.com/kb/en/cast/
    comment: >-
      `CAST(s AS CHAR [CHARACTER SET cs] COLLATE c)`; MySQL refuses `COLLATE`
      in the target, accepts it after the `CAST`.
  - id: cast_interval
    since: "10.6.3"
    source: https://mariadb.com/kb/en/cast/
    comment: >-
      `CAST(x AS INTERVAL DAY_SECOND(n))`, a duration written as a
      `VARCHAR(20)` (`00:00:42.00` for 42); MySQL has no such target.
  - id: inet6_type
    since: "10.5.0"
    source: https://mariadb.com/kb/en/inet6/
    comment: >-
      Type `INET6`, the target of `CAST`; MySQL has no such type.
  - id: inet4_type
    since: "10.10.1"
    source: https://mariadb.com/kb/en/inet4/
    comment: >-
      Type `INET4`, the target of `CAST`; refused by 10.6.28 (error 4161),
      accepted by 10.10.7, 10.11.19 and 11.8.9 (measured).
  # Behaviours of built-in functions.
  - id: timestamp_now
    since: "11.7.1"
    source: https://jira.mariadb.org/browse/MDEV-15751
    comment: >-
      `NOW()`, `CURRENT_TIMESTAMP`, `SYSDATE()` and `FROM_UNIXTIME()` give a
      `TIMESTAMP`, of the same value in the time zone of the session; a
      `DATETIME` before, as in MySQL.
  - id: time_localtime
    since: "11.6.2"
    source: https://jira.mariadb.org/browse/MDEV-34829
    comment: >-
      `LOCALTIME` gives the time of day, a `TIME`; the date and time before, a
      `DATETIME`, as in MySQL.
  - id: uuid_type
    since: "10.7.1"
    source: https://github.com/MariaDB/server/commit/b1fab9bf
    comment: >-
      `UUID()` gives a value of type `UUID`, compared only with UUIDs, of the
      same text as the `VARCHAR(36)` it gave before, as in MySQL. The type is
      also the target of `CAST` (refused by 10.6.28, error 4161).
  - id: aes_iv
    since: "11.2.1"
    source: https://jira.mariadb.org/browse/MDEV-9069
    comment: >-
      `AES_ENCRYPT` and `AES_DECRYPT` take an initialization vector, third
      argument, and a mode, fourth argument (`'aes-128-ecb'`, `'aes-256-cbc'`...),
      by default the variable `block_encryption_mode`, added with them; two
      arguments only before. The mode `aes-128-ecb`, the default, ignores the
      vector. Measured on 11.1.6 and 11.2.6.
  - id: unixtime_2106
    since: "11.5.1"
    source: https://jira.mariadb.org/browse/MDEV-32188
    comment: >-
      `UNIX_TIMESTAMP` and `FROM_UNIXTIME` reach 2106-02-07 06:28:15 UTC
      (2^32 - 1 seconds), as `TIMESTAMP`; 2038-01-19 03:14:07 UTC (2^31 - 1)
      before. Beyond, both give NULL. Measured on 11.4.13 and 11.5.2.
  - id: unixtime_epoch_null
    since: "11.7.1"
    source: https://jira.mariadb.org/browse/MDEV-15751
    comment: >-
      The epoch, the zero of `TIMESTAMP`, leaves the range of
      `UNIX_TIMESTAMP` and `FROM_UNIXTIME`: `UNIX_TIMESTAMP('1970-01-01
      00:00:00')` and `FROM_UNIXTIME(0)` give NULL in UTC, 0 and the epoch
      before; a fraction of a second after it stays in the range. Same change
      as `timestamp_now`. Measured on 11.6.2 and 11.7.2.
