# Constructs of the grammar, and behaviours of built-in functions, whose
# availability depends on the version (docs/DEV-DIALECTS.md, step 2). Each
# construct:
#   - id: values_row          # identifier, the `Construct` enum of versions.rs
#     since: "8.0.19"         # first version that has it (included)
#     until: "9.0.0"          # first version that no longer has it (optional)
#     source: https://...     # reference manual or release notes
#     comment: >-             # context: what the construct does, how it was
#       ...                   # established (optional)
constructs:
  - id: with
    since: "10.2.1"
    source: https://mariadb.com/kb/en/with/
  - id: with_recursive
    since: "10.2.2"
    source: https://mariadb.com/kb/en/recursive-common-table-expressions-overview/
  - id: window_functions
    since: "10.2.0"
    source: https://mariadb.com/kb/en/window-functions-overview/
  - id: values_bare
    since: "10.3.3"
    source: https://mariadb.com/kb/en/table-value-constructors/
  - id: system_versioning
    since: "10.3.4"
    source: https://mariadb.com/kb/en/system-versioned-tables/
  - id: nested_set_operation
    since: "10.4.0"
    source: https://jira.mariadb.org/browse/MDEV-11953
  - id: derived_column_list
    since: "11.7.1"
    source: https://jira.mariadb.org/browse/MDEV-31466
  - id: intersect_except
    since: "10.3.0"
    source: https://mariadb.com/kb/en/intersect/
  - id: intersect_except_all
    since: "10.5.0"
    source: https://mariadb.com/kb/en/intersect/
  - id: delete_returning
    since: "10.0.5"
    source: https://mariadb.com/kb/en/delete/
  - id: insert_returning
    since: "10.5.0"
    source: https://mariadb.com/kb/en/insertreturning/
  - id: json_table
    since: "10.6.0"
    source: https://mariadb.com/kb/en/json_table/
  - id: offset_fetch
    since: "10.6.0"
    source: https://mariadb.com/kb/en/select-offset-fetch/
  # Behaviours of built-in functions.
  - id: timestamp_now
    since: "11.7.1"
    source: https://jira.mariadb.org/browse/MDEV-15751
    comment: >-
      `NOW()`, `CURRENT_TIMESTAMP`, `SYSDATE()` and `FROM_UNIXTIME()` give a
      `TIMESTAMP`, of the same value in the time zone of the session; a
      `DATETIME` before, as in MySQL.
  - id: time_localtime
    since: "11.6.2"
    source: https://jira.mariadb.org/browse/MDEV-34829
    comment: >-
      `LOCALTIME` gives the time of day, a `TIME`; the date and time before, a
      `DATETIME`, as in MySQL.
  - id: uuid_type
    since: "10.7.1"
    source: https://github.com/MariaDB/server/commit/b1fab9bf
    comment: >-
      `UUID()` gives a value of type `UUID`, compared only with UUIDs, of the
      same text as the `VARCHAR(36)` it gave before, as in MySQL.
  - id: aes_iv
    since: "11.2.1"
    source: https://jira.mariadb.org/browse/MDEV-9069
    comment: >-
      `AES_ENCRYPT` and `AES_DECRYPT` take an initialization vector, third
      argument, and a mode, fourth argument (`'aes-128-ecb'`, `'aes-256-cbc'`...),
      by default the variable `block_encryption_mode`, added with them; two
      arguments only before. The mode `aes-128-ecb`, the default, ignores the
      vector. Measured on 11.1.6 and 11.2.6.
  - id: unixtime_2106
    since: "11.5.1"
    source: https://jira.mariadb.org/browse/MDEV-32188
    comment: >-
      `UNIX_TIMESTAMP` and `FROM_UNIXTIME` reach 2106-02-07 06:28:15 UTC
      (2^32 - 1 seconds), as `TIMESTAMP`; 2038-01-19 03:14:07 UTC (2^31 - 1)
      before. Beyond, both give NULL. Measured on 11.4.13 and 11.5.2.
  - id: unixtime_epoch_null
    since: "11.7.1"
    source: https://jira.mariadb.org/browse/MDEV-15751
    comment: >-
      The epoch, the zero of `TIMESTAMP`, leaves the range of
      `UNIX_TIMESTAMP` and `FROM_UNIXTIME`: `UNIX_TIMESTAMP('1970-01-01
      00:00:00')` and `FROM_UNIXTIME(0)` give NULL in UTC, 0 and the epoch
      before; a fraction of a second after it stays in the range. Same change
      as `timestamp_now`. Measured on 11.6.2 and 11.7.2.

# Built-in functions, by family, each family with the page of the manual that
# describes it. Each function:
#   - name: FORMAT_PICO_TIME   # name, in capitals
#     since: "8.0.16"          # period of the function, when it depends on
#     until: "9.0.0"           #   the version
#     source: https://...      # document of that version that attests it
#     grammar: true            # function of the grammar of the server: its
#                              #   name between backticks calls a stored
#                              #   function (`LEFT`(a)); without it, the
#                              #   quoted name is the built-in function
#     touching: true           # and so does a space before `(` (`NOW ()`),
#                              #   unless the SQL mode IGNORE_SPACE is set
#     mysql: same              # translation to MySQL, below
#
# Translation to MySQL, measured on the servers of `checked`:
#   same               the function of the same name of MySQL gives the same
#                      results (its availability comes from the reference
#                      file of MySQL);
#   { name: X }        another name, same arguments and results;
#   { rule: id }       a rule of Prisme writes it (`emit::builtin`), each
#                      with its test and its step in the report;
#   { error: reason }  untranslatable, an explicit error.
# Without translation, the function is absent from MySQL or not studied
# yet: an explicit error.
#
# Types and values that differ only outside the domain of a function (an
# invalid argument) are noted in a comment after the name.
#
# Left out: the functions of the versions newer than those of `checked`.
# Also left out: MBRCOVEREDBY, ST_COLLECT, ST_GEOHASH, ST_ISVALID,
# ST_LATFROMGEOHASH, ST_LONGFROMGEOHASH, ST_POINTFROMGEOHASH, ST_SIMPLIFY and
# ST_VALIDATE, which the function reference of MariaDB gives as 11.8 but
# MariaDB 11.8.9 lacks (measured).
functions:
  - family: Flow control
    manual: https://mariadb.com/docs/server/reference/sql-functions/control-flow-functions
    checked: [MySQL 8.0.11, MySQL 8.4.11, MariaDB 10.6.28, MariaDB 11.8.9]
    functions:
      - name: DECODE_ORACLE
      - name: IF
        grammar: true
        mysql: same
      - name: IFNULL
        mysql: same
      - name: NULLIF
        mysql: same
      - name: NVL
      - name: NVL2
  - family: Comparison
    manual: https://mariadb.com/docs/server/reference/sql-structure/operators/comparison-operators
    checked: [MySQL 8.0.11, MySQL 8.4.11, MariaDB 10.6.28, MariaDB 11.8.9]
    functions:
      - name: COALESCE
        mysql: same
      - name: GREATEST
        mysql: { rule: function.greatest }
      - name: INTERVAL
        grammar: true
        mysql: same
      - name: ISNULL
        mysql: same
      - name: LEAST
        mysql: { rule: function.greatest }
  - family: Numeric
    manual: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions
    checked: [MySQL 8.0.11, MySQL 8.4.11, MariaDB 10.6.28, MariaDB 11.8.9]
    functions:
