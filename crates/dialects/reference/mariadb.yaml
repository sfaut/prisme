# MariaDB: what Prisme knows of the dialect, version by version.
#
# The only source of these facts, one file per dialect: the keywords (read by
# the editor's highlighting, the beautifier and the parser), the constructs of
# the grammar whose availability depends on the version (read by the parser
# and the emitter) and the built-in functions with their translation (read by
# the parser, the plan builder and the emitter). Edited directly, embedded in
# the executable.
#
# Versions: the file covers every version from `floor`, the first GA release
# of MariaDB 10.6 (docs/QUESTIONS.md, point 51). A fact that depends on the version
# carries its period: `since`, the first version that has it (included), and
# `until`, the first version that no longer has it; without them, it holds in
# every version. A fact that appeared before the floor holds in every version
# offered.
#
# Sources: a fact that depends on the version cites the document that attests
# it, for that version: reference manual of the series, release notes, ticket
# of the engine.
#
# What is missing from this file is absent from MariaDB: the parser of the
# MariaDB dialect refuses it (rule "each dialect stays in its domain"), and
# reads a function name it does not list as a stored function.

floor: "10.6.3"

# Last version inspected, by section: the section is complete up to that
# version (included), from the reference manual of its series, the release
# notes and measures on the servers (MariaDB 10.6.28 and 11.8.9). An update
# starts from the release notes of the later versions. A later fact may be
# known already, found in passing. A section left out has not been inspected
# version by version yet: its facts are filled in as they become known.
inspected:
  functions: "11.8.9"

# Keywords, by category; each category maps to a highlighting class of the
# editor. A word is either a plain name, or a name with its versions:
#   - name: WINDOW
#     since: "8.0"
#     until: "9.0"
# Versions are filled in as they become known.
#
# NULL, TRUE and FALSE are written between quotes: without them, YAML reads
# them as an empty value and booleans, not as words.
#
# Be careful before adding a non-reserved word: the beautifier will put it in
# capitals wherever it appears, including as a table name, and on Linux a
# table name is case-sensitive.
#
# To refine: the list currently takes the reserved words of MySQL 8, which
# the beautifier also applied to MariaDB. MariaDB's reserved words partly
# differ (window functions not reserved, for example).
