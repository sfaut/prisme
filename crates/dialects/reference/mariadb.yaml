# Constructs of the grammar whose availability depends on the version
# (docs/DEV-DIALECTS.md, step 2). Each construct:
#   - id: values_row          # identifier, the `Construct` enum of versions.rs
#     since: "8.0.19"         # first version that has it (included)
#     until: "9.0.0"          # first version that no longer has it (optional)
#     source: https://...     # reference manual or release notes
constructs:
  - id: with
    since: "10.2.1"
    source: https://mariadb.com/kb/en/with/
  - id: with_recursive
    since: "10.2.2"
    source: https://mariadb.com/kb/en/recursive-common-table-expressions-overview/
  - id: window_functions
    since: "10.2.0"
    source: https://mariadb.com/kb/en/window-functions-overview/
  - id: values_bare
    since: "10.3.3"
    source: https://mariadb.com/kb/en/table-value-constructors/
  - id: system_versioning
    since: "10.3.4"
    source: https://mariadb.com/kb/en/system-versioned-tables/
  - id: nested_set_operation
    since: "10.4.0"
    source: https://jira.mariadb.org/browse/MDEV-11953
  - id: derived_column_list
    since: "11.7.1"
    source: https://jira.mariadb.org/browse/MDEV-31466
  - id: intersect_except
    since: "10.3.0"
    source: https://mariadb.com/kb/en/intersect/
  - id: intersect_except_all
    since: "10.5.0"
    source: https://mariadb.com/kb/en/intersect/
  - id: delete_returning
    since: "10.0.5"
    source: https://mariadb.com/kb/en/delete/
  - id: insert_returning
    since: "10.5.0"
    source: https://mariadb.com/kb/en/insertreturning/
  - id: json_table
    since: "10.6.0"
    source: https://mariadb.com/kb/en/json_table/
  - id: offset_fetch
    since: "10.6.0"
    source: https://mariadb.com/kb/en/select-offset-fetch/
