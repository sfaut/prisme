  # Reserved words that designate a value (`x = NULL`, `d - CURRENT_DATE`):
  # in an expression, they play the role of an operand. Those other than
  # `NULL`, `TRUE` and `FALSE` call a function without parentheses, as
  # `CURRENT_DATE()` does (measured on MySQL 8.0.11 and 8.4.11).
  literals:
    - "NULL"
    - "TRUE"
    - "FALSE"
    - CURRENT_DATE
    - CURRENT_TIME
    - CURRENT_TIMESTAMP
    - CURRENT_USER
    - LOCALTIME
    - LOCALTIMESTAMP
    - UTC_DATE
    - UTC_TIME
    - UTC_TIMESTAMP

# Constructs of the grammar, and behaviours of built-in functions, whose
# availability depends on the version (docs/DEV-DIALECTS.md, step 2). Each
# construct:
#   - id: values_row          # identifier, the `Construct` enum of versions.rs
#     since: "8.0.19"         # first version that has it (included)
#     until: "9.0.0"          # first version that no longer has it (optional)
#     source: https://...     # reference manual or release notes
#     comment: >-             # context: what the construct does, how it was
#       ...                   # established (optional)
constructs:
  - id: with
    since: "8.0.1"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-1.html
  - id: with_recursive
    since: "8.0.1"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-1.html
    comment: >-
      The anchors come before the recursive parts (error 3574); a recursive
      part reads the expression once, in its `FROM`, outside a derived table
      and a subquery (error 3577), without `GROUP BY`, aggregate or window
      (3575), nor `DISTINCT` (1235). The columns take the type of the anchors,
      a `BIGINT` for an integer literal. Measured on each local image, 8.0.11
      to 9.3.0 (crates/probe/cases/with-recursive.sql).
  - id: recursive_limit
    since: "8.0.19"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-19.html
    comment: >-
      `LIMIT` and `OFFSET` over the parts of a recursive common table
      expression, which stop its iterations once the rows are found (Bug
      #92857); error 1235 from 8.0.11 to 8.0.18, measured on each local image
      (crates/probe/cases/with-recursive.sql).
  - id: window_functions
    since: "8.0.2"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-2.html
  - id: json_table
    since: "8.0.4"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-4.html
  - id: json_arrow
    since: "5.7.9"
    source: https://dev.mysql.com/doc/relnotes/mysql/5.7/en/news-5-7-9.html
    comment: >-
      `column->path`, the `JSON_EXTRACT` of a column, qualified or not, and of
      a single string literal, without introducer; a string after the path is
      an alias. Measured on each local image, 8.0.11 to 8.0.28, 8.0.30, 8.0.31,
      8.1.0, 8.4.11 and 9.3.0 (crates/probe/cases/json-arrows.sql).
  - id: json_double_arrow
    since: "5.7.13"
    source: https://dev.mysql.com/doc/relnotes/mysql/5.7/en/news-5-7-13.html
    comment: >-
      `column->>path`, the `JSON_UNQUOTE` of the `JSON_EXTRACT` of
      `column->path`, of the same forms. Measured with `json_arrow`.
  - id: lateral
    since: "8.0.14"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-14.html
  # Available at the floor (checked on MySQL 8.0.11).
  - id: derived_column_list
    since: "8.0.11"
    source: https://dev.mysql.com/doc/refman/8.0/en/derived-tables.html
  - id: derived_outer_reference
    since: "8.0.14"
    source: https://dev.mysql.com/doc/refman/8.0/en/derived-tables.html
  - id: explain_format_tree
    since: "8.0.16"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-16.html
  - id: member_of
    since: "8.0.17"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-17.html
  - id: explain_analyze
    since: "8.0.18"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-18.html
  - id: values_row
    since: "8.0.19"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-19.html
  - id: table_statement
    since: "8.0.19"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-19.html
  - id: insert_row_alias
    since: "8.0.19"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-19.html
  - id: nested_set_operation
    since: "8.0.31"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-31.html
    comment: >-
      A set operation between parentheses as a right operand
      (`SELECT 1 UNION (SELECT 2 UNION SELECT 3)`), WL #11350
      (docs/sources/mysql/8.0.31.md): error 1064 from 8.0.11 to 8.0.18, 1235
      from 8.0.19 to 8.0.30, accepted from 8.0.31. Measured on each local
      image, 8.0.11 to 8.0.28, 8.0.30, 8.0.31, 8.1.0, 8.4.11 and 9.3.0
      (crates/probe/cases/nested-set-operations.sql).
  # Query between parentheses with its own `ORDER BY` or `LIMIT`, followed by
  # an outer one (crates/probe/cases/parenthesized-limits.sql, measured on each
  # local image, 8.0.11 to 8.0.28, 8.0.30, 8.0.31, 8.1.0, 8.4.11 and 9.3.0;
  # docs/sources/mysql/parenthesized-limits.md). An outer `OFFSET` over an
  # inner `LIMIT` counts from the start of the inner rows in every version
  # (construct `parenthesized_offset_kept`, absent).
  - id: parenthesized_order_kept
    since: "8.0.19"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-19.html
    comment: >-
      `(SELECT a FROM t ORDER BY a DESC LIMIT 2) LIMIT 5` keeps the order of
      the query between parentheses (Bug #30521098, docs/sources/mysql/8.0.19.md);
      the outer `LIMIT` drops it before.
  - id: parenthesized_limit_kept
    since: "8.0.31"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-31.html
    comment: >-
      `(SELECT a FROM t LIMIT 2) LIMIT 5` gives 2 rows at most (WL #11350,
      Bug #103954); before, the outer `LIMIT` overrides the inner one, its
      offset included (5 rows).
  - id: parenthesized_set_limit
    since: "8.0.11"
    until: "8.0.19"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-31.html
    comment: >-
      `(SELECT a FROM t UNION SELECT 6 ORDER BY 1 LIMIT 2) LIMIT 5`: refused
      from 8.0.19 to 8.0.30 (error 1235), with an outer `ORDER BY` or
      `LIMIT`, accepted before and after.
  - id: parenthesized_set_limit
    since: "8.0.31"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-31.html
    comment: >-
      Accepted again from 8.0.31 (WL #11350).
  - id: parenthesized_set_order
    since: "8.0.19"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-19.html
    comment: >-
      `(SELECT a FROM t UNION SELECT 6 ORDER BY 1 LIMIT 2) ORDER BY 1 DESC`:
      up to 8.0.18, the outer `ORDER BY` sorts the rows of the union before
      its `LIMIT` (6, 5); refused from 8.0.19 to 8.0.30
      (`parenthesized_set_limit`), 2, 1 from 8.0.31.
  - id: parenthesized_order_result
    since: "8.0.31"
    until: "8.0.42"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-31.html
    comment: >-
      `(SELECT id, a AS b FROM t) ORDER BY b + 0` sorts by the alias `b`, the
      column of the result, and `(SELECT id FROM t) ORDER BY a` is refused
      (error 1054), from 8.0.31 (WL #11350) to 8.0.41, 8.1.0 to 8.4.4 and
      9.0.0 to 9.2.0. Before and after, and in MariaDB, the names are read as
      those of an `ORDER BY` of the `SELECT`: inside an expression, the
      column `b` of the source first. Without `ORDER BY` or `LIMIT` between
      the parentheses only; measured on each local image, 9.0.0 having none
      (crates/probe/cases/alias-references.sql). The release notes of 8.0.42,
      8.4.5 and 9.3.0 say nothing of it. These versions sort the rows otherwise
      by an expression of the alias of a grouping key that is an expression,
      in a block with aggregate functions:
      `(SELECT a % 2 AS x, COUNT(*) AS n FROM t GROUP BY x) ORDER BY -x`.
  - id: parenthesized_order_result
    since: "8.1.0"
    until: "8.4.5"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.4/en/news-8-4-5.html
    comment: >-
      As in 8.0.31 to 8.0.41; measured on 8.1.0, 8.2.0, 8.3.0, 8.4.0, 8.4.2,
      8.4.3, 8.4.4, and otherwise on 8.4.5 and 8.4.11.
  - id: parenthesized_order_result
    since: "9.0.0"
    until: "9.3.0"
    source: https://dev.mysql.com/doc/relnotes/mysql/9.7/en/news-9-3-0.html
    comment: >-
      As in 8.0.31 to 8.0.41; measured on 9.0.1, 9.1.0 and 9.2.0, and
      otherwise on 9.3.0.
  - id: parenthesized_order_subquery
    since: "8.0.31"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-31.html
    comment: >-
      `(SELECT id, a AS b FROM t) ORDER BY (SELECT b)` sorts by the alias
      `b`, from 8.0.31, after 8.0.42, 8.4.5 and 9.3.0 too, where the other
      names of that `ORDER BY` are read as those of the `SELECT`; the column
      `b` of the source before 8.0.31 and in MariaDB.
  - id: window_alias_once
    since: "8.0.11"
    until: "8.0.16"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-29.html
    comment: >-
      `SELECT id, ROW_NUMBER() OVER (ORDER BY b) AS r FROM t ORDER BY r + 0`
      computes the window function once. From 8.0.16 to 8.0.28, it is
      computed again for the sort, which numbers 1, 2, 4 the rows of a table
      of three (`RANK`, `SUM` up to 8.0.26), the function written in `ORDER
      BY` aside; measured on each local image
      (crates/probe/cases/alias-references.sql).
  - id: window_alias_once
    since: "8.0.29"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-29.html
    comment: >-
      Bug #32695670: an alias inside an expression of `ORDER BY` resolved as
      an alias written alone; measured on 8.0.30 and later.
  - id: aggregate_alias_read
    since: "8.0.29"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-29.html
    comment: >-
      `SELECT a % 2 AS x, COUNT(*) AS n FROM t GROUP BY x ORDER BY n + 0 DESC`
      sorts on the count. Before, the alias of an aggregate function inside
      an expression of `ORDER BY` or of a window reads one value for all the
      rows: the rows keep their order, `RANK() OVER (ORDER BY n + 0)` gives
      1 to every row; measured on 8.0.11 to 8.0.28 and from 8.0.30
      (crates/probe/cases/alias-references.sql). Bug #32695670.
  - id: window_shadowed_column
    since: "8.0.14"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-14.html
    comment: >-
      `SELECT a AS b, ROW_NUMBER() OVER (ORDER BY b) FROM t` sorts on the
      column `b`; error 1054 before (Bug #27808099, "failed with Unknown field
      in window order by even when the column was found in the table"),
      measured on 8.0.11 to 8.0.13 (crates/probe/cases/alias-references.sql).
      MariaDB reads the alias.
  - id: rollup_order_by
    since: "8.0.12"
    source: https://dev.mysql.com/doc/refman/8.0/en/group-by-modifiers.html
  - id: intersect_except
    since: "8.0.31"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-31.html
  - id: intersect_except_all
    since: "8.0.31"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-31.html
  # Targets of `CAST` and `CONVERT` (crates/probe/cases/cast-forms.txt, measured on
  # 8.0.11, 8.0.17, 8.0.22, 8.0.27, 8.4.11 and 9.3.0, and cast-bounds.txt, on each
  # version from 8.0.17 to 8.0.27).
  - id: cast_double
    since: "8.0.17"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-17.html
    comment: >-
      `CAST(x AS DOUBLE)` and `CAST(x AS FLOAT)`; a syntax error before
      (8.0.16 measured).
  - id: cast_double_synonyms
    since: "8.0.17"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-17.html
    comment: >-
      `CAST(x AS DOUBLE PRECISION)`, `AS REAL` (a `FLOAT` under
      `REAL_AS_FLOAT`) and `AS FLOAT(p)`, a `FLOAT` up to 24 bits, a `DOUBLE`
      from 25 to 53; MariaDB has none of them.
  - id: cast_national_char
    since: "8.0.11"
    source: https://dev.mysql.com/doc/refman/8.0/en/cast-functions.html
    comment: >-
      `CAST(x AS NATIONAL CHAR)`, as `NCHAR`; MariaDB refuses it. Available
      at the floor (checked on MySQL 8.0.11).
  - id: cast_json
    since: "5.7.8"
    source: https://dev.mysql.com/doc/relnotes/mysql/5.7/en/news-5-7-8.html
    comment: >-
      `CAST(x AS JSON)`, with the type `JSON`; MariaDB has no such target.
  - id: cast_year
    since: "8.0.22"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-22.html
    comment: >-
      `CAST(x AS YEAR)`; a syntax error in 8.0.17 (measured).
  - id: cast_at_time_zone
    since: "8.0.22"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-22.html
    comment: >-
      `CAST(ts AT TIME ZONE [INTERVAL] '+00:00' AS DATETIME[(n)])`, the zone
      `+00:00` or `UTC` only, of a `TIMESTAMP`: its date and time in UTC.
  - id: cast_spatial
    since: "8.0.24"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-24.html
    comment: >-
      `CAST(g AS POINT)` and the other spatial types but `GEOMETRY`; a syntax
      error in 8.0.23, accepted in 8.0.24 (crates/probe/cases/cast-bounds.txt).
  # Behaviours of built-in functions.
  - id: cast_unsigned_wrap
    since: "8.0.19"
    source: https://dev.mysql.com/doc/refman/8.4/en/cast-functions.html
    comment: >-
      `CAST(-3.7 AS UNSIGNED)`, of a negative decimal, gives the unsigned
      integer of the same bits (18446744073709551612), as for a float or a
      time; 0 before, as in MariaDB (crates/probe/cases/cast-bounds.txt,
      measured 0 on 8.0.17 and 8.0.18, the integer on 8.0.19 to 8.0.27).
  - id: datetime_offset
    since: "8.0.19"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-19.html
    comment: >-
      A time zone offset after the time of a date and time literal or string
      (`TIMESTAMP '2024-05-06 01:00:00+02:00'`, `CAST('...+02:00' AS
      DATETIME)`), from -14:00 to +14:00, the value converted to the time zone
      of the session; before, error 1525 for a literal, a string for its ODBC
      form, the offset ignored by `CAST` (crates/probe/cases/cast-bounds.txt
      and typed-literals-offsets.txt, measured on 8.0.18 and 8.0.19). MariaDB
      refuses it likewise.
  - id: time_interval_datetime
    since: "8.0.28"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-28.html
    comment: >-
      A `TIME` moved by an interval of days or longer (`t + INTERVAL 1 DAY`,
      `DATE_ADD`, `ADDDATE`, `TIMESTAMPADD`) gives a `DATETIME`, the time
      read on the current date (Bug #103781); before, a `TIME` of the hours
      added by `DAY` and `WEEK`, NULL by a month or a year. MariaDB gives a
      `TIME` by `DAY` and its compound units, NULL by the longer ones
      (crates/probe/cases/interval-time*.txt, measured on 8.0.11 and 8.0.20
      to 8.0.28, 8.1.0 and 8.4.11).
  - id: pad_empty_string
    since: "8.0.13"
    until: "9.3.0"
    source: https://github.com/mysql/mysql-server/blob/mysql-8.0.13/sql/item_strfunc.cc
    comment: >-
      `LPAD` and `RPAD` with an empty pad, beyond the length of the string,
      give an empty string (`make_empty_result` in the source); NULL before,
      as in MariaDB. Measured on 8.0.11 and 8.4.
  - id: pad_unchanged
    since: "9.3.0"
    source: https://bugs.mysql.com/bug.php?id=117227
    comment: >-
      `LPAD` and `RPAD` with an empty pad, beyond the length of the string,
      give the string unchanged; an empty string before. Measured on 9.3.0.
  - id: unixtime_3001
    since: "8.0.28"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-28.html
    comment: >-
      `UNIX_TIMESTAMP` and `FROM_UNIXTIME` reach 3001-01-18 23:59:59.999999
      UTC (32536771199 seconds) on 64-bit platforms, beyond the `TIMESTAMP`
      type; 2038-01-19 03:14:07 UTC (2^31 - 1) before (WL#14630). Beyond,
      `UNIX_TIMESTAMP` gives 0, as before the epoch, and `FROM_UNIXTIME`
      NULL. Measured on 8.0.27 and 8.0.28.
  - id: condition_compared
    since: "8.0.17"
    source: https://dev.mysql.com/worklog/task/?id=12358
    comment: >-
      `WHERE`, `HAVING`, `ON` and the operands of `NOT`, `AND`, `OR`, `XOR`
      and `IS TRUE` read a value `x` as `x <> 0` (WL#12358). Before, `WHERE`,
      `HAVING`, `ON` and `XOR` read a string, a float, a decimal or a time
      with a fraction as an integer (`WHERE '0.5'` and `0.4 XOR 0` give
      false), and `NOT (a XOR b)` as `(NOT a) XOR b`; a `JSON`, compared
      with 0 by the rules of JSON, is true unless it is the number 0 (`NOT
      CAST('false' AS JSON)` gives 0, 1 before), read before as a number, as
      `IF` and `CASE WHEN` read it in every version (`true` 1, an object 0).
      No entry in the release notes; bisected on the images 8.0.11 to 8.0.17
      (crates/probe/cases/json-truth.txt, fraction-truth.txt). MariaDB reads
      its `JSON`, a `LONGTEXT`, as a string (`'true'` 0).
  - id: json_in_compared
    since: "8.0.17"
    source: https://github.com/mysql/mysql-server/blob/mysql-8.0.17/sql/item_cmpfunc.cc
    comment: >-
      `IN` of a list compares all its values by the rules of JSON when one
      of them is a `JSON` (`compare_as_json` and `cmp_item_json` in
      `Item_func_in::resolve_type`; no entry in the release notes): `v IN
      ('b', 1)` is true for the JSON string `"b"` and the number `1`.
      Before, with a warning (`unsupported_json_comparison`), a `JSON` as
      its text against a string (`{"a": 1}` equals `'{"a": 1}'`, `"b"`
      differs from `'b'`) and as a number against a number (`true` equals
      1). A list of one value is a comparison `=`, alike in every version
      (crates/probe/cases/json-text.txt, measured on 8.0.11 to 8.0.17 and
      8.4.11).
  - id: regexp_integer
    since: "8.0.12"
    source: https://github.com/mysql/mysql-server/blob/mysql-8.0.12/sql/item_regexp_func.h
    comment: >-
      `REGEXP` and `REGEXP_LIKE` give an integer (`set_data_type_longlong`
      in the constructor of `Item_func_regexp_like`; no entry in the release
      notes): a `BIGINT(21)` in 8.0.12 and 8.0.13, an `INT` from 8.0.14, of
      the same values. In 8.0.11, a `DOUBLE(21, 0)`, which arithmetic
      carries: `(s REGEXP 'b') / 3` is a `DOUBLE` of 4 fractional digits, a
      `DECIMAL` from 8.0.12. `NOT REGEXP`, the `NOT` of a `REGEXP`, gives
      an integer in every version (crates/probe/cases/regexp-type.txt,
      measured on 8.0.11 to 8.0.14 and 8.4.11).
  - id: regexp_binary
    since: "8.0.12"
    source: https://github.com/mysql/mysql-server/blob/mysql-8.0.12/sql/item_regexp_func.cc
    comment: >-
      `REGEXP` reads a binary string byte by byte, case-sensitive, a
      character string with it in its character set (`CONVERT('é' USING
      utf8mb4) REGEXP CAST('^..$' AS BINARY)` gives 0). In 8.0.11, a binary
      string otherwise: `CAST('aBc' AS BINARY) REGEXP CAST('B' AS BINARY)`
      gives 0, `CAST(CONVERT('é' USING utf8mb4) AS BINARY) REGEXP '^.$'` 1.
      No entry in the release notes; bisected on the images 8.0.11 and
      8.0.12 (crates/probe/cases/regexp-binary.txt).
  - id: regexp_binary_error
    since: "8.0.22"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-22.html
    comment: >-
      `REGEXP` and the functions of regular expressions refuse a binary
      string with a character string, error 3995 (Bug #98950), and read two
      binary strings byte by byte, as before
      (crates/probe/cases/regexp-binary.txt, measured on 8.0.12, 8.0.15 to
      8.0.17, 8.0.20 to 8.0.23 and 8.4.11).
  - id: string_charset
    since: "8.0.19"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-19.html
    comment: >-
      `REPLACE`, `SUBSTRING_INDEX` and `TRIM` take the character set of their
      string, their other arguments converted to it at execution, error 3854
      when their bytes are not valid in it (Bug #30114420): a binary argument
      with a character string gives a character string. Before, as in
      MariaDB, the character sets of the arguments are aggregated: a binary
      string, of the same bytes (crates/probe/cases/string-binary.txt,
      measured on 8.0.12, 8.0.14, 8.0.17 to 8.0.20, 8.0.23 and 8.4.11).
  - id: locate_charset
    since: "8.0.26"
    source: https://github.com/mysql/mysql-server/blob/mysql-8.0.26/sql/item_func.cc
    comment: >-
      `LOCATE`, `INSTR` and `POSITION` search in the collation of their
      string, the substring converted to its character set
      (`Item_func_locate::resolve_type` and `val_int` in the source; no entry
      in the release notes): a binary substring is searched in a character
      string after its collation, its position counted in characters, and a
      `COLLATE` of the substring is ignored. Before, as in MariaDB, the
      collations are aggregated: a binary substring is searched byte by
      byte, its position counted in bytes (`POSITION(CAST('B' AS BINARY) IN
      'abc')` gives 0, 2 from 8.0.26; crates/probe/cases/string-binary.txt,
      measured on 8.0.14, 8.0.17, 8.0.18, 8.0.20, 8.0.23 to 8.0.26 and
      8.4.11).
  - id: bit_window
    since: "8.0.12"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-12.html
    comment: >-
      `BIT_AND`, `BIT_OR` and `BIT_XOR` as window functions (WL#11573);
      error 1235 before (crates/probe/cases/bitwise-windows.sql, measured on
      8.0.11, 8.0.12 and 8.4.11).
  - id: hex_long_zero
    since: "8.0.27"
    source: https://github.com/mysql/mysql-server/blob/mysql-8.0.27/sql/item.cc
    comment: >-
      A hexadecimal or bit literal of more than 8 bytes, a byte before the
      last 8 not zero, read as a number: 0, 2^64 - 1 before, with the warning
      1292 (`Item_hex_string::val_int` returns 0 in 8.0.27, -1 in 8.0.26).
      Measured on 8.0.11 to 8.0.23, 8.0.25 to 8.0.28 and 8.4.11
      (crates/probe/cases/literals-hex-long.txt); the code in
      docs/sources/mysql/item-hex-string-val-int.md.
  - id: union_all_found_rows
    since: "8.0.18"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-18.html
    comment: >-
      `FOUND_ROWS()` after `SQL_CALC_FOUND_ROWS` on a set operation of
      `UNION ALL` alone, with a `LIMIT` and without `ORDER BY`, counts every
      row: `SELECT SQL_CALC_FOUND_ROWS id FROM t UNION ALL SELECT 9 LIMIT 2`
      over 4 rows gives 5, and 2 before, the rows up to the `LIMIT`, as
      MariaDB in every version; the same everywhere with an `ORDER BY` or a
      `UNION` (crates/probe/cases/select-options.sql, measured on each local
      image of MySQL, 8.0.11 to 9.3.0, and of MariaDB, 10.5.29 to 11.8.9).
      The release notes of 8.0.18 change the evaluation of `UNION ALL ...
      LIMIT` ("evaluated an excessive number of rows", Bug #79340) without
      naming `FOUND_ROWS()`.
  # Locking clauses (crates/probe/cases/locking.sql, measured on each local
  # image, 8.0.11 to 9.3.0; docs/sources/mysql/locking-reads.md): `FOR
  # UPDATE`, `FOR SHARE` and `LOCK IN SHARE MODE` after the `LIMIT`, `OF`,
  # `NOWAIT` and `SKIP LOCKED` after `FOR` only, from 8.0.1 (WL #8919, WL
  # #3597), before the first version measured.
  - id: lock_share
    since: "8.0.1"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-1.html
    comment: >-
      `SELECT a FROM t FOR SHARE`, the same lock as `LOCK IN SHARE MODE`,
      which the manual keeps for compatibility.
  - id: lock_of
    since: "8.0.1"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-1.html
    comment: >-
      `SELECT p.a FROM t AS p JOIN u AS q ON q.id = p.id FOR UPDATE OF p`:
      the tables of the block by their alias, or their name without alias
      (`OF t`, `OF db.t`), the case compared as written (`OF T` refused,
      error 3568, on a server with case-sensitive names); a common table
      expression read by the block, not a derived table (error 3569), nor a
      table of a subquery (error 3568). `OF` is reserved from 8.0.1.
  - id: lock_clauses
    since: "8.0.1"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-1.html
    comment: >-
      `... FOR UPDATE OF p FOR SHARE OF q`: each table in one clause only,
      a clause without `OF` alone (error 3569, `FOR UPDATE FOR UPDATE` and
      `FOR UPDATE LOCK IN SHARE MODE` included).
  - id: lock_nowait
    since: "8.0.1"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-1.html
    comment: >-
      `FOR UPDATE NOWAIT`, `FOR SHARE OF t NOWAIT`; refused after `LOCK IN
      SHARE MODE` (error 1064), as is `SKIP LOCKED`.
  - id: lock_skip_locked
    since: "8.0.1"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-1.html
    comment: >-
      `FOR UPDATE SKIP LOCKED`, `FOR SHARE SKIP LOCKED`; never with
      `NOWAIT`.
  - id: parenthesized_lock
    since: "8.0.31"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-31.html
    comment: >-
      `(SELECT a FROM t) FOR UPDATE`, `((SELECT a FROM t)) FOR UPDATE`,
      `(SELECT a FROM t UNION SELECT b FROM u) FOR UPDATE`, in a subquery
      and a derived table too: error 1064 up to 8.0.30 (1248 for a derived
      table), accepted from 8.0.31 (WL #11350, the parentheses of the query
      expressions). An `ORDER BY` or a `LIMIT` after the parentheses lets
      every version read it: `(SELECT a FROM t) ORDER BY a FOR UPDATE`.
  - id: parenthesized_operand_lock
    since: "8.0.1"
    source: https://dev.mysql.com/doc/refman/8.0/en/select.html
    comment: >-
      `SELECT a FROM t UNION (SELECT b FROM u LIMIT 1) FOR UPDATE`,
      `(SELECT a FROM t) UNION (SELECT b FROM u) FOR UPDATE`: accepted in
      every version measured, the clause locking the tables of the last
      operand.
  # Rows locked by a locking clause next to a query between parentheses
  # (crates/probe/cases/locking-scope.sql, trx_rows_locked measured on each
  # local image, 8.0.11 to 9.3.0; `locking` module): a clause after the outer
  # `ORDER BY` or `LIMIT` locks the rows of the query between parentheses
  # when the server joins the outer clauses to its own, none otherwise.
  - id: parenthesized_limit_lock
    since: "8.0.1"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-1.html
    comment: >-
      `(SELECT a FROM t LIMIT 2) LIMIT 1 FOR UPDATE` locks the rows of `t`
      read, `(SELECT a FROM t LIMIT 2) FOR UPDATE` too from 8.0.31
      (`parenthesized_lock`), in every version measured; none in MariaDB.
  - id: parenthesized_set_limit_lock
    since: "8.0.1"
    until: "8.0.18"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-1.html
    comment: >-
      `(SELECT a FROM t UNION SELECT b FROM u ORDER BY 1 LIMIT 3) LIMIT 2
      FOR UPDATE` locks the rows of `u` up to 8.0.17, none in 8.0.18; 8.0.19
      to 8.0.30 refuse the query (error 1235, `parenthesized_set_limit`).
  - id: parenthesized_set_limit_lock
    since: "8.0.31"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-31.html
    comment: >-
      As up to 8.0.17, `(SELECT a FROM t UNION SELECT b FROM u LIMIT 4) FOR
      UPDATE` included.
  - id: parenthesized_order_lock
    since: "8.0.18"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-18.html
    comment: >-
      `(SELECT a FROM t LIMIT 2) ORDER BY a FOR UPDATE`, `(SELECT a FROM t
      ORDER BY a) ORDER BY a DESC FOR UPDATE`, over a set operation with its
      own `ORDER BY` or `LIMIT` too: no row locked up to 8.0.17, those of the
      query between parentheses from 8.0.18; the release notes of 8.0.18
      say nothing of it.
  - id: parenthesized_set_order_lock
    since: "8.0.18"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-18.html
    comment: >-
      `(SELECT a FROM t UNION SELECT b FROM u) ORDER BY a FOR UPDATE` locks
      the rows of `u` from 8.0.18, none up to 8.0.17, as with an outer
      `LIMIT` after the `ORDER BY`.
  - id: parenthesized_inner_lock
    since: "8.0.19"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-19.html
    comment: >-
      `(SELECT a FROM t FOR UPDATE) LIMIT 1`, `(SELECT a FROM t UNION SELECT
      b FROM u FOR UPDATE) LIMIT 4`: no row locked up to 8.0.18, the outer
      `LIMIT` dropping the clause (Bug #30521098); an outer `ORDER BY` keeps
      it in every version.
  - id: parenthesized_locked_limit
    since: "8.0.1"
    until: "8.0.19"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-1.html
    comment: >-
      `(SELECT a FROM t ORDER BY a) LIMIT 2 FOR UPDATE`, `(SELECT a FROM t
      ORDER BY a FOR UPDATE) LIMIT 1`: every row from 8.0.19 to 8.0.25, the
      outer `LIMIT` left aside, the rows bounded before and after; with an
      outer `ORDER BY`, a `LIMIT` between the parentheses, or without
      `ORDER BY` between them, the rows bounded in every version. The
      release notes of 8.0.19 and 8.0.26 say nothing of it.
  - id: parenthesized_locked_limit
    since: "8.0.26"
    source: https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-26.html
    comment: As up to 8.0.18.
  # User and system variables (crates/probe/cases/variables.sql and
  # variables-grammar.sql, measured on each local image, 8.0.11 to 9.3.0).
  - id: empty_user_variable
    since: "5.0.0"
    source: https://dev.mysql.com/doc/refman/8.4/en/user-variables.html
    comment: >-
      `SELECT @''`, `` @`` ``, `@` alone read the variable of an empty name,
      NULL: `SELECT @ a` is that variable, named `a` by its alias (`@ a AS
      b` is a syntax error). Its assignment is refused (`@'' := 1`, `SET
      @'' = 1`, error 3061, "User variable name '' is illegal"). Not in the
      manual, measured.
  # `tx_isolation` and `tx_read_only`, deprecated in 5.7.20, removed in 8.0.3
  # (WL #9636): none in the versions covered.
  - id: transaction_variables
    since: "5.7.20"
    source: https://dev.mysql.com/doc/relnotes/mysql/5.7/en/news-5-7-20.html
    comment: >-
      `transaction_isolation` and `transaction_read_only`, created as aliases
      of `tx_isolation` and `tx_read_only` (WL #9636).

# Built-in functions, by family, each family with the page of the manual that
# describes it. Each function:
#   - name: FORMAT_PICO_TIME   # name, in capitals
#     since: "8.0.16"          # period of the function, when it depends on
#     until: "9.0.0"           #   the version
#     source: https://...      # document of that version that attests it
#     grammar: true            # function of the grammar of the server: its
#                              #   name between backticks calls a stored
#                              #   function (`LEFT`(a)); without it, the
#                              #   quoted name is the built-in function
#     touching: true           # and so does a space before `(` (`NOW ()`),
#                              #   unless the SQL mode IGNORE_SPACE is set
#     type: text               # type of the result, below
#     nulls: args              # NULL only when an argument may be
#     mariadb: same            # translation to MariaDB, below
#
# Translation to MariaDB, measured on the servers of `checked`:
#   same               the function of the same name of MariaDB gives the same
#                      results (its availability comes from the reference
#                      file of MariaDB);
#   same_except: [types]
#   reason: reason     the same, but for an argument of one of these types
#                      (temporal: a date or a time; float: a FLOAT or a
#                      DOUBLE; wide_decimal: a DECIMAL of more than 15
#                      digits), or of a type unknown to Prisme: an explicit
#                      error, for this reason (rule `function.argument`);
#   { name: X }        another name, same arguments and results;
#   { rule: id }       a rule of Prisme writes it (`emit::builtin`), each
#                      with its test and its step in the report;
#   { error: reason }  untranslatable, an explicit error.
# Without translation, the function is absent from MariaDB or not studied
# yet: an explicit error.
#
# Type of the result, in the dialect of the file, from the calls generated
# by `probe calls` and measured on each local image (`function_types`):
#   int, int unsigned, bigint, bigint unsigned, double, date, year, json,
#   geometry, uuid, text (any character string), bytes (any byte string):
#                      the same type whatever the arguments;
#   { string: [1, 3] } a string of bytes when one of the arguments at these
#   { string: from 2 } positions (or from this one) is a byte string, or
#                      when they are all NULL, of characters otherwise;
#   [int, "8.0.24", bigint]
#                      a type per period: the type of the first versions,
#                      then each version from which another type holds,
#                      followed by it.
# Without type, a type that depends on the arguments otherwise, unknown to
# Prisme. `nulls`: `args`, NULL only when one of the arguments may be NULL;
# `never`; without it, NULL whatever the arguments. The aggregate and window
# functions are typed by the plan builder (`build::functions`).
#
# Types and values that differ only outside the domain of a function (an
# invalid argument) are noted in a comment after the name.
#
# Left out: the functions of the versions newer than those of `checked`.
# Also left out: the internal functions of the server (`CAN_ACCESS_...`,
# `INTERNAL_...`, `GET_DD_...`, `IS_VISIBLE_DD_OBJECT`), "intended only for
# internal use by the server. Attempts by users to invoke them result in an
# error" (https://dev.mysql.com/doc/refman/8.4/en/internal-functions.html).
functions:
  - family: Flow control
    manual: https://dev.mysql.com/doc/refman/8.4/en/flow-control-functions.html
    checked: [MySQL 8.0.11, MySQL 8.4.11, MariaDB 10.6.28, MariaDB 11.8.9]
    functions:
      - name: IF
        grammar: true
        mariadb: { rule: function.if }
      - name: IFNULL
        mariadb: same
      - name: NULLIF
        mariadb: same
  - family: Comparison
    manual: https://dev.mysql.com/doc/refman/8.4/en/comparison-operators.html
    checked: [MySQL 8.0.11, MySQL 8.4.11, MariaDB 10.6.28, MariaDB 11.8.9]
    functions:
      - name: COALESCE
        grammar: true
        mariadb: same
      - name: GREATEST
        nulls: args
        mariadb: { rule: function.greatest }
      - name: INTERVAL
        grammar: true
        type: int
        nulls: never
        mariadb: same
      - name: ISNULL
        type: [int, "8.0.27", int unsigned, "8.0.28", int]
        nulls: never
        mariadb: same
      - name: LEAST
        nulls: args
        mariadb: { rule: function.greatest }
  - family: Numeric
    manual: https://dev.mysql.com/doc/refman/8.4/en/mathematical-functions.html
    checked: [MySQL 8.0.11, MySQL 8.4.11, MariaDB 10.6.28, MariaDB 11.8.9]
    functions:
      - name: ABS
        nulls: args
        mariadb: same
      - name: ACOS
        type: double
        mariadb: same
      - name: ASIN
        type: double
        mariadb: same
      - name: ATAN
        type: double
        mariadb: same
      - name: ATAN2
        type: double
        mariadb: same
      - name: CEIL
        nulls: args
        mariadb: same
      - name: CEILING
        nulls: args
        mariadb: same
      - name: CONV
        type: text
        mariadb: same
      - name: COS
        type: double
        mariadb: same
      - name: COT
        type: double
        mariadb: same
      - name: CRC32
        type: int unsigned
        nulls: args
        mariadb: same
      - name: DEGREES
        type: double
        nulls: args
        mariadb: same
      - name: EXP
        type: double
        mariadb: same
      - name: FLOOR
        nulls: args
        mariadb: same
      - name: LN  # 0 or a negative number: NULL in both, with different warnings
