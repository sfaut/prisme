  # Column types, reserved.
  types:
    - BIGINT
    - BINARY
    - BLOB
    - CHAR
    - CHARACTER
    - DEC
    - DECIMAL
    - DOUBLE
    - FLOAT
    - FLOAT4
    - FLOAT8
