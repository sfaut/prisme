types:
  - BIGINT
  - BINARY
  - BLOB
  - CHAR
  - CHARACTER
  - DEC
  - DECIMAL
  - DOUBLE
  - FLOAT
  - FLOAT4
  - FLOAT8
  - INT
  - INT1
