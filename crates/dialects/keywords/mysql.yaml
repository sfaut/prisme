# MySQL keywords (base: reserved words of MySQL 8).
#
# A single list per dialect, read by the SQL editor's highlighting and by
# the beautifier (keywords put in capitals). Each category maps to a
# highlighting class of the editor.
#
# A word is either a plain name, or a name with its versions:
#   - name: WINDOW
#     since: "8.0"       # available from this version (included)
#     until: "9.0"       # removed from this version (optional)
# Versions are filled in as they become known.
#
# NULL, TRUE and FALSE are written between quotes: without them, YAML reads
# them as an empty value and booleans, not as words.
#
# Be careful before adding a non-reserved word: the beautifier will put it in
# capitals wherever it appears, including as a table name, and on Linux a
# table name is case-sensitive.

# Reserved words: cannot be used as a name without backticks.
reserved:
  - ACCESSIBLE
  - ADD
  - ALL
  - ALTER
  - ANALYZE
  - AND
  - AS
  - ASC
  - ASENSITIVE
