# Mots-clefs non réservés, sans ambiguïté en pratique.
keywords:
  - BEGIN
  - COLUMNS
  - COMMIT
  - END
  - OFFSET
  - ROLLBACK
  - TABLES
  - TRANSACTION
  - TRUNCATE
  - VIEW

