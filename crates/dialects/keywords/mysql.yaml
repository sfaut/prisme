# Mots-clefs de MySQL (base : mots réservés de MySQL 8).
#
# Une seule liste par dialecte, lue par la coloration de l'éditeur SQL et
# par l'enjoliveur (mots-clefs mis en capitales). Chaque catégorie se range
# dans une classe de coloration de l'éditeur.
#
# Un mot est soit un simple nom, soit un nom avec ses versions :
#   - name: WINDOW
#     since: "8.0"       # disponible à partir de cette version (incluse)
#     until: "9.0"       # retiré à partir de cette version (facultatif)
# Les versions se renseignent au fil de l'eau.
#
# NULL, TRUE et FALSE s'écrivent entre guillemets : sans eux, YAML les lit
# comme une valeur vide et des booléens, et non comme des mots.
#
# Prudence avant d'ajouter un mot non réservé : l'enjoliveur le mettra en
# capitales partout où il apparaît, y compris comme nom de table, et sous
# Linux un nom de table tient compte de la casse.

# Mots réservés : ne peuvent pas servir de nom sans accents graves.
