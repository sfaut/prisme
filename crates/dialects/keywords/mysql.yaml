  - INT4
  - INT8
  - INTEGER
  - LONG
  - LONGBLOB
  - LONGTEXT
  - MEDIUMBLOB
  - MEDIUMINT
  - MEDIUMTEXT
  - MIDDLEINT
  - NUMERIC
  - REAL
  - SMALLINT
  - TINYBLOB
  - TINYINT
  - TINYTEXT
  - VARBINARY
  - VARCHAR
  - VARCHARACTER

# Mots réservés qui désignent une valeur (`x = NULL`, `d - CURRENT_DATE`) :
# dans une expression, ils jouent le rôle d'un opérande.
literals:
  - "NULL"
  - "TRUE"
  - "FALSE"
  - CURRENT_DATE
  - CURRENT_TIME
  - CURRENT_TIMESTAMP
  - CURRENT_USER
  - LOCALTIME
  - LOCALTIMESTAMP
  - UTC_DATE
  - UTC_TIME
  - UTC_TIMESTAMP
