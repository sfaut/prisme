# Reserved words that designate a value (`x = NULL`, `d - CURRENT_DATE`):
# in an expression, they play the role of an operand.
literals:
  - "NULL"
  - "TRUE"
  - "FALSE"
  - CURRENT_DATE
  - CURRENT_TIME
  - CURRENT_TIMESTAMP
  - CURRENT_USER
  - LOCALTIME
  - LOCALTIMESTAMP
  - UTC_DATE
  - UTC_TIME
  - UTC_TIMESTAMP
