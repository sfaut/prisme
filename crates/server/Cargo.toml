[package]
name = "prisme-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "prisme"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
prisme-connectors = { path = "../connectors" }
prisme-dialects = { path = "../dialects" }
prisme-splitter = { path = "../splitter" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"

[dev-dependencies]
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", features = ["mariadb"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
# Generated TypeScript types formatted (dprint), only in the tests that write them.
ts-rs = { version = "12.0.1", features = ["format"] }
